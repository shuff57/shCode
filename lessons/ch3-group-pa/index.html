<!DOCTYPE html>
<html>
<head>
  <title>Snack Shack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Snack Shack</h1>
  <p class="hint">Open the Console under the editor to see your PASS/FAIL self-check.</p>

  <div id="summary" class="summary">Total inventory value: —</div>

  <h2>Receipt</h2>
  <div id="receipt" class="lines"></div>

  <h2>Low stock (under 5)</h2>
  <div id="low" class="lines"></div>

  <div class="controls">
    <button id="sell">Sell 1 Popcorn</button>
    <button id="save">Save</button>
    <button id="load">Load</button>
  </div>
</body>
</html>
