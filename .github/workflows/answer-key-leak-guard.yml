name: answer-key-leak-guard

# The answer-key leak checks (`scripts/check-solution-leak.mjs`,
# `scripts/check-quiz-key-leak.mjs`, `scripts/check-reshape-solutions.mjs`)
# used to depend on a human remembering to run them. A starter that shipped a
# solution, or a summative answer key serialised into a built page, got found
# by a student before a build. This workflow wires the checks into CI so a
# build fails if an answer key can leak.
#
# `check-quiz-key-leak.mjs` reads the BUILT output (`out/`), so this runs the
# real `npm run build` first, then the leak checks WITHOUT `--allow-missing`:
# a missing export directory fails loudly instead of printing NOT CHECKED.

on:
  push:
    branches: [cs-3d]
  pull_request:
    branches: [cs-3d]
  # Run the guard on the default branch's schedule too, so a leak introduced
  # outside a PR (content-only push) is caught within a day.
  schedule:
    - cron: '27 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in flight: the
# guard checks the whole tree, so only the newest commit's verdict matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  answer-key-leak-guard:
    runs-on: ubuntu-latest
    # Runs take ~75 s warm, under 4.5 min cold (peak 4.1 min before the caches).
    # 15 leaves room for a cold cache on a slow runner, and a hung build now
    # holds a runner 15 min instead of 45.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 24

      # node_modules itself, keyed on the lockfile and the exact Node version:
      # a hit skips `npm ci` (13-16s of unpacking ~1.2 GB) entirely. A miss --
      # a dependency or Node bump -- installs from scratch and saves a new one.
      # Two native binaries nothing in this job runs are left out (~417 MB):
      # onnxruntime-node's (the PII guard runs onnxruntime-web in the browser)
      # and wrangler's workerd. Their package.json and JS stay, so module
      # resolution is unchanged; only the binaries are missing on a hit.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/onnxruntime-node/bin
            !node_modules/@cloudflare/workerd-linux-64/bin
          key: node-modules-slim-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      # reshape-cad is consumed three ways: the npm file: deps point at the
      # vendored copy inside this repo, but scripts/_pkg-load.mjs resolves the
      # '@shuff57/reshape-*' module specifiers in the COMPILED output at
      # GITHUB_ROOT/reshape-cad (a sibling of shCode, the real checkout layout
      # on a dev machine). Give CI that sibling as a symlink to the vendored
      # packages — same files, the layout _pkg-load.mjs resolves through.
      - name: Give the vendored reshape-cad its sibling path
        run: |
          repo_dir="$(pwd)"
          ln -s "$repo_dir/vendor/reshape-cad" "$(dirname "$repo_dir")/reshape-cad"
          # the compiled cross-package imports resolve @shuff57/reshape-* from
          # reshape-cad/packages, so mirror shCode's node_modules links there
          mkdir -p vendor/reshape-cad/packages/node_modules/@shuff57
          for pkg in sketch script kernel studio; do
            ln -s "../../$pkg" "vendor/reshape-cad/packages/node_modules/@shuff57/reshape-$pkg"
          done

      # The B-rep kernel bundle is gitignored and needs the OpenCascade wasm.
      # Build scripts (check-reshape-solutions.mjs) load replicad_single.js
      # from public/reshape/kernel/. Pull the same build npm serves.
      - name: Cache the OpenCascade wasm
        id: occt-cache
        uses: actions/cache@v4
        with:
          path: ~/occt/replicad-opencascadejs-1.1.0
          key: occt-replicad-opencascadejs-1.1.0

      - name: Fetch OpenCascade wasm for the B-rep kernel
        run: |
          dir="$HOME/occt/replicad-opencascadejs-1.1.0"
          if [ ! -f "$dir/package/dist/replicad_single.wasm" ]; then
            mkdir -p "$dir" && cd "$dir"
            npm pack replicad-opencascadejs@1.1.0 --silent
            tar xzf replicad-opencascadejs-1.1.0.tgz package/dist/replicad_single.js package/dist/replicad_single.wasm
            rm replicad-opencascadejs-1.1.0.tgz
          fi
          echo "OCCT_DIR=$dir/package/dist" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --include=dev --no-audit --no-fund

      # build-pii-guard-models.mjs (in prebuild) downloads ~24 MB of ONNX
      # weights from Hugging Face and skips any file already present. Keyed on
      # the lockfile too: it also copies the ONNX runtime out of node_modules,
      # and a skipped copy must not outlive a dependency bump.
      - name: Cache the PII-guard models
        uses: actions/cache@v4
        with:
          path: public/models
          key: pii-models-${{ hashFiles('scripts/build-pii-guard-models.mjs', 'package-lock.json') }}

      # Next's webpack cache. Only pushes and the schedule write it, so a PR
      # run pays the restore but never the upload.
      - name: Restore the Next.js build cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.js') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.js') }}-

      # `npm run build` runs the full prebuild chain -- including the B-rep
      # kernel bundle (build-brep-kernel.mjs reads OCCT_DIR from the env set
      # above) and check-solution-leak, the starter-bundle leak check -- and
      # then `next build`, which exports out/. A failing prebuild check fails
      # this step.
      - name: Build (kernel bundle + check-solution-leak run in prebuild)
        run: npm run build

      - name: Save the Next.js build cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.js') }}-${{ github.sha }}

      - name: Built-page answer-key leak check
        run: node scripts/check-quiz-key-leak.mjs

      - name: Reshape reference-solution guard
        run: node scripts/check-reshape-solutions.mjs --occt public/reshape/kernel