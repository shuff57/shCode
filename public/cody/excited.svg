<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- CODY, excited: star eyes, sparks. Our own design (shCode #88), from scripts/make-cody-faces.py. -->
  <style>
    .lamp { animation: glow 3.2s ease-in-out infinite; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    .bob { animation: bob 2.6s ease-in-out infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.6s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.2s ease-in-out infinite; }
    .dot { animation: dots 1.2s ease-in-out infinite; } .d2 { animation-delay: .2s; } .d3 { animation-delay: .4s; }
    .float { animation: float 2.4s ease-in-out infinite; } .f2 { animation-delay: .8s; }
    .twinkle { animation: glow 0.9s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(.9); } 50% { transform: scale(1.1); } }
    @keyframes dots { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes float { 0% { opacity: 0; transform: translate(0, 2px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(2px, -5px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <path class="twinkle" d="M14 4 l1.5 2 M34 4 l-1.5 2 M10 8 l2 1 M38 8 l-2 1" stroke="#f1fa8c" stroke-width="1.4" stroke-linecap="round"/><g class="bob">
    <line x1="24" y1="10" x2="24" y2="5" stroke="#bd93f9" stroke-width="2" stroke-linecap="round"/>
    <circle class="twinkle" cx="24" cy="3.6" r="2.6" fill="#f1fa8c"/>
    <rect x="2" y="21" width="4" height="9" rx="2" fill="#bd93f9"/>
    <rect x="42" y="21" width="4" height="9" rx="2" fill="#bd93f9"/>
    <rect x="5" y="10" width="38" height="31" rx="11" fill="#282a36" stroke="#bd93f9" stroke-width="2"/>
    <rect x="9" y="14" width="30" height="23" rx="7" fill="#1e1f29"/>
    <polygon class="pulse" points="18.00,19.00 19.06,21.54 21.80,21.76 19.71,23.56 20.35,26.24 18.00,24.80 15.65,26.24 16.29,23.56 14.20,21.76 16.94,21.54" fill="#f1fa8c"/><polygon class="pulse" points="30.00,19.00 31.06,21.54 33.80,21.76 31.71,23.56 32.35,26.24 30.00,24.80 27.65,26.24 28.29,23.56 26.20,21.76 28.94,21.54" fill="#f1fa8c"/><path d="M19 29 Q24 36 29 29 Z" fill="#8be9fd"/>
  </g>
</svg>
