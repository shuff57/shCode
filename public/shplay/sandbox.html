<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>shPlay sandbox</title>
<style>
	* { box-sizing: border-box; }
	html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1a; color: #eee; font-family: system-ui, sans-serif; }
	body { display: grid; grid-template-rows: auto 1fr; }
	header { padding: 10px 14px; background: #0e0e0e; border-bottom: 1px solid #333; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
	header h1 { margin: 0; font: 600 14px system-ui; color: #f59e0b; }
	header button { background: #16a34a; color: #fff; border: 0; padding: 6px 14px; border-radius: 4px; cursor: pointer; font: 600 13px system-ui; }
	header button:hover { background: #15803d; }
	header select { background: #1f1f1f; color: #eee; border: 1px solid #444; padding: 5px 8px; border-radius: 4px; font: 13px system-ui; cursor: pointer; }
	header .hint { color: #888; font: 12px system-ui; margin-left: auto; }
	#status { font: 12px ui-monospace; color: #888; }
	main { display: grid; grid-template-columns: minmax(320px, 480px) 1fr; gap: 0; min-height: 0; }
	textarea { background: #0a0a0a; color: #eee; border: 0; border-right: 1px solid #333; padding: 12px; font: 13px/1.5 ui-monospace, Menlo, monospace; resize: none; outline: none; tab-size: 2; }
	#preview { width: 100%; height: 100%; border: 0; background: #111; display: block; }
	#log { position: fixed; bottom: 0; right: 0; max-width: 50%; max-height: 30vh; overflow: auto; background: rgba(0,0,0,0.85); padding: 8px; font: 11px/1.4 ui-monospace; color: #eee; border-top-left-radius: 6px; pointer-events: none; }
	#log .err { color: #fca5a5; }
	#log .warn { color: #fcd34d; }
</style>
</head>
<body>
<header>
	<h1>shPlay</h1>
	<button id="run" title="Ctrl+Enter">▶ Run</button>
	<select id="example" title="Load a preset sketch">
		<option value="">— Examples —</option>
		<option value="rotating">Rotating cube</option>
		<option value="wasd">WASD movement</option>
		<option value="spin3d">3-axis rotation</option>
		<option value="grid">Grid of cubes</option>
		<option value="primitives">Cube + Sphere + Plane</option>
		<option value="bouncer">Bouncing cube</option>
		<optgroup label="Phase 0 demos">
		<option value="shapes2">shapes2 — Cone/Cylinder/Torus</option>
		<option value="randomColors">randomColors — 25 random cubes</option>
		<option value="collide">collide — sphere overlap detection</option>
		<option value="groupDemo">groupDemo — Group remove</option>
		<option value="lights">lights — PointLight + ambient toggle</option>
		<option value="materials">materials — metalness/roughness row</option>
		<option value="cameraFollow">camera-follow — follow a moving cube</option>
		<option value="cameraOrbit">camera-orbit — orbit around origin</option>
		<option value="physicsFloor">physics-floor — drop a sphere</option>
		<option value="physicsPlatforms">physics-platforms — WASD on platforms</option>
		<option value="parenting">parenting — child follows parent</option>
		</optgroup>
	</select>
	<span id="status"></span>
	<span class="hint">Ctrl+Enter to run · click the preview, then WASD/etc.</span>
</header>
<main>
	<textarea id="code" spellcheck="false"></textarea>
	<iframe id="preview"></iframe>
</main>
<div id="log"></div>
<script>
const EXAMPLES = {
	rotating: `// Rotating cube — the "hello world" of shPlay.
let cube;
function setup() {
  cube = new Cube(0, 0, 0);
  cube.color = 'tomato';
  cube.size = 1.5;
}
function draw() {
  background('#222');
  cube.rotation.y += 0.01;
}
`,
	wasd: `// WASD moves the cube on the X/Z plane.
let cube;
function setup() {
  cube = new Cube(0, 0, 0);
  cube.color = 'deepskyblue';
}
function draw() {
  background('#1a1a2e');
  if (kb.pressing('a')) cube.position.x -= 0.08;
  if (kb.pressing('d')) cube.position.x += 0.08;
  if (kb.pressing('w')) cube.position.z -= 0.08;
  if (kb.pressing('s')) cube.position.z += 0.08;
  cube.rotation.y += 0.01;
}
`,
	spin3d: `// Rotation around all three axes at different speeds.
let cube;
function setup() {
  cube = new Cube(0, 0, 0);
  cube.color = 'gold';
  cube.size = 2;
}
function draw() {
  background('#222');
  cube.rotation.x += 0.005;
  cube.rotation.y += 0.01;
  cube.rotation.z += 0.003;
}
`,
	grid: `// 5x5 grid of cubes, each with a unique color.
let cubes = [];
function setup() {
  for (let x = -2; x <= 2; x++) {
    for (let z = -2; z <= 2; z++) {
      let c = new Cube(x * 1.5, 0, z * 1.5, 0.8);
      c.color = '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');
      cubes.push(c);
    }
  }
}
function draw() {
  background('#0e0e1a');
  for (let c of cubes) c.rotation.y += 0.01;
}
`,
	primitives: `// Cube, Sphere, Plane on a floor.
let cube, ball, floor;
function setup() {
  floor = new Plane(0, -1, 0, 12, 12);
  floor.color = '#444';

  cube = new Cube(-2, 0, 0);
  cube.color = 'tomato';

  ball = new Sphere(2, 0, 0, 0.8);
  ball.color = 'limegreen';
}
function draw() {
  background('#222');
  cube.rotation.y += 0.01;
  ball.position.y = Math.sin(frameCount * 0.05) * 0.5;
}
`,
	bouncer: `// Cube bounces back at the walls.
let cube, vx = 0.06, vz = 0.04;
function setup() {
  cube = new Cube(0, 0, 0);
  cube.color = 'hotpink';
}
function draw() {
  background('#1a0e1a');
  cube.position.x += vx;
  cube.position.z += vz;
  if (Math.abs(cube.position.x) > 4) vx = -vx;
  if (Math.abs(cube.position.z) > 3) vz = -vz;
  cube.rotation.x += 0.02;
  cube.rotation.y += 0.03;
}
`,

	// 2.1 — Cone, Cylinder, Torus each slowly rotating on Y
	shapes2: `// shapes2 — Cone, Cylinder, and Torus side by side.
let cone, cyl, torus;
function setup() {
  cone = new Cone(-2, 0, 0, 0.5, 2);
  cone.color = 'orange';
  cyl = new Cylinder(0, 0, 0, 0.5, 1.5);
  cyl.color = 'deepskyblue';
  torus = new Torus(2, 0, 0, 0.6, 0.2);
  torus.color = 'gold';
  new Plane(0, -1.5, 0, 10, 10);
}
function draw() {
  background('#222');
  cone.rotation.y += 0.01;
  cyl.rotation.y += 0.015;
  torus.rotation.y += 0.02;
}
`,

	// 2.2 — 25 cubes with random colors using random()
	randomColors: `// randomColors — 25 cubes with random() colors.
function setup() {
  background('#0e0e1a');
  for (let x = -2; x <= 2; x++) {
    for (let z = -2; z <= 2; z++) {
      let c = new Cube(x * 1.8, 0, z * 1.8, 0.9);
      c.color = '#' + Math.floor(random(0, 0xffffff)).toString(16).padStart(6, '0');
    }
  }
}
function draw() {
  background('#0e0e1a');
}
`,

	// 2.4 — Two spheres that turn red when they intersect
	collide: `// collide — two spheres turn red when intersects() is true.
let a, b;
function setup() {
  a = new Sphere(-2, 0, 0, 0.8);
  a.color = 'limegreen';
  b = new Sphere(2, 0, 0, 0.8);
  b.color = 'limegreen';
}
function draw() {
  background('#222');
  // Drift toward each other
  a.position.x += Math.sin(frameCount * 0.02) * 0.04;
  b.position.x -= Math.sin(frameCount * 0.02) * 0.04;
  const hit = intersects(a, b);
  a.color = hit ? 'red' : 'limegreen';
  b.color = hit ? 'red' : 'limegreen';
}
`,

	// 2.5 — Group demo: spawn cubes, remove one per Space press
	groupDemo: `// groupDemo — Group.remove() in action. Press Space to remove one cube.
let g;
function setup() {
  g = new Group();
  for (let x = -2; x <= 2; x++) {
    for (let z = -2; z <= 2; z++) {
      let c = new Cube(x * 1.3, 0, z * 1.3, 0.8);
      c.color = '#' + Math.floor(random(0, 0xffffff)).toString(16).padStart(6, '0');
      g.add(c);
    }
  }
}
function draw() {
  background('#111');
  if (kb.presses('space') && g.length > 0) {
    // Remove the first cube in the group
    const first = g.filter(() => true)[0];
    g.remove(first);
  }
  for (let s of g) s.rotation.y += 0.01;
}
`,

	// 2.6 — PointLight orbits a cube; L toggles ambient
	lights: `// lights — orbiting PointLight; press L to toggle ambient.
let cube, pt, ambOn = true;
function setup() {
  cube = new Cube(0, 0, 0, 1.5);
  cube.color = 'white';
  new Plane(0, -1, 0, 8, 8);
  pt = new PointLight(0, 2, 3, 'white', 2);
  sunLight.intensity = 0;
}
function draw() {
  background('#111');
  pt.position.x = Math.cos(frameCount * 0.03) * 3;
  pt.position.z = Math.sin(frameCount * 0.03) * 3;
  if (kb.presses('l')) {
    ambOn = !ambOn;
    ambientLight.intensity = ambOn ? 0.5 : 0;
  }
}
`,

	// 2.7 — Row of 5 spheres with metalness 0→1 and roughness 1→0
	materials: `// materials — metalness/roughness spectrum across 5 spheres.
function setup() {
  for (let i = 0; i < 5; i++) {
    let s = new Sphere(i * 1.5 - 3, 0, 0, 0.6);
    s.color = '#ccc';
    s.metalness = i / 4;   // 0, 0.25, 0.5, 0.75, 1
    s.roughness = 1 - i / 4; // 1, 0.75, 0.5, 0.25, 0
  }
  new Plane(0, -0.7, 0, 10, 10);
  sunLight.position.x = 5;
  sunLight.intensity = 2;
}
function draw() {
  background('#222');
}
`,

	// 2.8a — camera.follow tracks a cube on a sine path
	cameraFollow: `// camera-follow — camera tracks a moving cube.
let cube;
function setup() {
  cube = new Cube(0, 0, 0, 1);
  cube.color = 'tomato';
  new Plane(0, -1, 0, 20, 20);
  camera.follow(cube, 0, 3, 7);
}
function draw() {
  background('#1a1a2e');
  cube.position.x = Math.sin(frameCount * 0.02) * 5;
  cube.position.z = Math.cos(frameCount * 0.015) * 3;
  cube.rotation.y += 0.02;
}
`,

	// 2.8b — camera.orbit rotates around a static scene
	cameraOrbit: `// camera-orbit — camera rotates around the scene.
function setup() {
  let cube = new Cube(0, 0, 0, 1.5);
  cube.color = 'gold';
  new Sphere(2, 0.5, -1, 0.6).color = 'tomato';
  new Plane(0, -1, 0, 10, 10);
  camera.orbit(0.01);
}
function draw() {
  background('#111');
}
`,

	// 2.10a — Sphere drops from y=5 onto the floor
	physicsFloor: `// physics-floor — sphere dropped from y=5; physics lands it.
let ball;
function setup() {
  ball = new Sphere(0, 5, 0, 0.5);
  ball.color = 'limegreen';
  ball.usePhysics = true;
  new Plane(0, -1, 0, 10, 10);
  camera.follow(ball, 0, 3, 8);
}
function draw() {
  background('#1a1a1a');
}
`,

	// 2.10b — Sphere with WASD; three Cube platforms as ground
	physicsPlatforms: `// physics-platforms — WASD walk between raised Cube platforms.
let player;
function setup() {
  player = new Sphere(0, 4, 0, 0.4);
  player.color = 'tomato';
  player.usePhysics = true;
  player.friction = 0.8;

  // Floor
  new Plane(0, 0, 0, 12, 12);

  // Three elevated platforms
  let p1 = new Cube(-3, 1, -2, 2, 0.4, 2); p1.color = '#888'; p1.isGround = true;
  let p2 = new Cube(0, 2, 1, 2, 0.4, 2);   p2.color = '#888'; p2.isGround = true;
  let p3 = new Cube(3, 3, -1, 2, 0.4, 2);  p3.color = '#888'; p3.isGround = true;

  camera.follow(player, 0, 4, 8);
}
function draw() {
  background('#111');
  const spd = 4;
  if (kb.pressing('a')) player.vel.x = -spd;
  if (kb.pressing('d')) player.vel.x = spd;
  if (kb.pressing('w')) player.vel.z = -spd;
  if (kb.pressing('s')) player.vel.z = spd;
  if (kb.presses('space') && player.onGround) player.vel.y = 6;
}
`,

	// 2.12 — Sphere parented to a cube; parent oscillates
	parenting: `// parenting — sphere follows its parent cube via parent().
let body, head;
function setup() {
  body = new Cube(0, 0, 0, 1);
  body.color = 'deepskyblue';
  head = new Sphere(0, 1.2, 0, 0.5);
  head.color = 'limegreen';
  parent(head, body); // attach head to body
  new Plane(0, -1, 0, 10, 10);
}
function draw() {
  background('#222');
  body.position.x = Math.sin(frameCount * 0.03) * 2;
  body.rotation.y += 0.02;
  // head automatically follows because it is parented to body
}
`,
};

const codeEl = document.getElementById('code');
const previewEl = document.getElementById('preview');
const runBtn = document.getElementById('run');
const exampleEl = document.getElementById('example');
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const STORAGE_KEY = 'shplay-sandbox-code';
let runKey = 0;

// Restore last edit from localStorage so refresh doesn't lose work.
codeEl.value = localStorage.getItem(STORAGE_KEY) || EXAMPLES.rotating;

codeEl.addEventListener('input', () => {
	localStorage.setItem(STORAGE_KEY, codeEl.value);
});

function encode(s) {
	const utf8 = unescape(encodeURIComponent(s));
	const b64 = btoa(utf8);
	return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}


function run() {
	logEl.textContent = '';
	statusEl.textContent = '';
	runKey++;
	previewEl.src = './runner.html?code=' + encode(codeEl.value) + '&r=' + runKey;
	// Focus the preview so kb.pressing works without an extra click.
	setTimeout(() => previewEl.focus(), 200);
}

function appendLog(text, cls) {
	const d = document.createElement('div');
	d.textContent = text;
	if (cls) d.className = cls;
	logEl.appendChild(d);
	logEl.scrollTop = logEl.scrollHeight;
}

window.addEventListener('message', (e) => {
	const d = e.data;
	if (!d) return;
	if (d.source === 'preview-console') {
		const msg = '[' + d.type + '] ' + d.args.map(a => typeof a === 'string' ? a : JSON.stringify(a)).join(' ');
		appendLog(msg, d.type === 'error' ? 'err' : (d.type === 'warn' ? 'warn' : ''));
	} else if (d.source === 'preview-error') {
		appendLog('ERR ' + d.error.name + ': ' + d.error.message + (d.error.file ? ' @ ' + d.error.file + ':' + d.error.line : ''), 'err');
	} else if (d.source === 'shplay-status') {
		statusEl.textContent = d.text;
		statusEl.style.color = d.ok ? '#34d399' : '#f87171';
	}
});

runBtn.addEventListener('click', run);
exampleEl.addEventListener('change', () => {
	const key = exampleEl.value;
	if (!key) return;
	codeEl.value = EXAMPLES[key];
	localStorage.setItem(STORAGE_KEY, codeEl.value);
	exampleEl.value = '';
	run();
});

codeEl.addEventListener('keydown', (e) => {
	if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
	// Tab inserts two spaces instead of leaving the textarea.
	if (e.key === 'Tab') {
		e.preventDefault();
		const start = codeEl.selectionStart, end = codeEl.selectionEnd;
		codeEl.value = codeEl.value.slice(0, start) + '  ' + codeEl.value.slice(end);
		codeEl.selectionStart = codeEl.selectionEnd = start + 2;
	}
});

run();
</script>
</body>
</html>
