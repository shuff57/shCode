<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>moSHion runner</title>
<style>
	html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; color: #eee; font-family: system-ui, sans-serif; }
	body { display: flex; align-items: center; justify-content: center; }
	canvas { display: block; max-width: 100%; max-height: 100%; }
	/* ?fit=1 additionally scales the sketch UP to fill the frame. Opt-in, because
	   only a curated showcase wants it: a student who asks for a 200x200 canvas
	   should get 200x200, not a blurry blow-up. `height:100%` with `width:auto`
	   lets the intrinsic ratio pick the width, and max-width re-derives the height
	   from the same ratio when the frame is the narrow axis — so the element box
	   stays tight to the pixels and getBoundingClientRect() (which the mouse
	   scaling reads) never includes letterbox padding. */
	body.fit canvas { width: auto; height: 100%; max-width: 100%; max-height: none; }
	#error { position: fixed; top: 0; left: 0; right: 0; background: rgba(220,38,38,0.92); color: #fff; padding: 8px 12px; font: 12px/1.4 monospace; white-space: pre-wrap; display: none; z-index: 100; }
	#empty { color: #666; font: 13px system-ui; text-align: center; }
</style>
<script>
// Pipe console + errors to parent (matches the existing preview-console protocol).
// Student source is stashed on window.__previewSources so the error handler can
// look up the offending source line for richer error messages.
(function() {
	function send(type, args) {
		try {
			var safe = Array.prototype.slice.call(args).map(function(a) {
				if (a instanceof Error) return a.stack || a.message;
				if (typeof a === 'object') { try { return JSON.parse(JSON.stringify(a)); } catch(e){ return String(a); } }
				return a;
			});
			window.parent.postMessage({ source: 'preview-console', type: type, args: safe }, '*');
		} catch (e) { /* parent gone */ }
	}
	['log','warn','error','info'].forEach(function(t) {
		var orig = console[t];
		console[t] = function() { send(t, arguments); orig.apply(console, arguments); };
	});

	function parseStudentFrame(stack) {
		if (!stack) return null;
		var sources = window.__previewSources || {};
		var lines = String(stack).split('\n');
		var rx = /([A-Za-z_][\w./-]*\.js):(\d+):(\d+)/;
		for (var i = 0; i < lines.length; i++) {
			var m = rx.exec(lines[i]);
			if (m && Object.prototype.hasOwnProperty.call(sources, m[1])) {
				return { file: m[1], line: parseInt(m[2], 10), col: parseInt(m[3], 10) };
			}
		}
		return null;
	}
	function lineSnippet(file, line) {
		var src = (window.__previewSources || {})[file];
		if (!src || !line) return '';
		var arr = src.split('\n');
		return (arr[line - 1] || '').replace(/^\s+/, '').slice(0, 200);
	}
	// A plain first sentence for the slips a beginner makes most (the 5.1
	// walk, 2026-11-03: a missing bracket, Sprite(...) without new, a colour
	// with no quotes, a sketch with no canvas yet). It goes ON TOP of the
	// engine's message, never instead of it: the real message stays word for
	// word on the next line, so CODY, the console and a teacher still see it.
	// Posted as `hint` beside the untouched name/message.
	var NO_CANVAS = 'new Canvas(w, h) must be called in setup()';
	// Chrome wraps a parse error in a script added with appendChild in its own
	// words ("Failed to execute 'appendChild' on 'Node': missing ) after
	// argument list"). That half is about the runner, not the student's code.
	var HOST_PREFIX = /^Failed to execute '[^']*' on '[^']*': /;
	// Where a typo is. A parse error carries no position in the student's code
	// (its stack points at the runner's inject()), so ask the engine instead:
	// the error is on the first line whose prefix already fails with the SAME
	// message as the whole sketch. Same method as locateSyntaxError in
	// lib/js-runner-source.ts (the console runner), which this copies.
	function locateTypo(code, message) {
		var lines = String(code).split('\n');
		if (lines.length > 2000) return null;
		if (/unexpected eof/i.test(message)) return null;
		var lastLine = function() {
			for (var i = lines.length - 1; i >= 0; i--) if (lines[i].trim() !== '') return i + 1;
			return null;
		};
		if (/end of (input|script)|unterminated template/i.test(message)) return lastLine();
		// The Function constructor closes the body with a "}" of its own, so an
		// unclosed brace swallows it and reads as "Unexpected token ')'". If a
		// closer makes the sketch parse, it simply ends too soon.
		var closers = ['}', ')', ']', '}}', '})', '}]', '))', ')}'];
		for (var c = 0; c < closers.length; c++) {
			try { new Function(String(code) + '\n' + closers[c]); return lastLine(); } catch (e) { /* not this closer */ }
		}
		for (var k = 1; k <= lines.length; k++) {
			try { new Function(lines.slice(0, k).join('\n')); }
			catch (e) { if (e && e.name === 'SyntaxError' && e.message === message) return k; }
		}
		return null;
	}
	// The sketch itself does not parse. A SyntaxError thrown while it RUNS
	// (JSON.parse of a bad string) is not a typo, and must not be called one.
	function sketchFailsToParse(code) {
		if (typeof code !== 'string') return false;
		try { new Function(code); return false; } catch (e) { return !!(e && e.name === 'SyntaxError'); }
	}
	// `deepskyblue is not defined` gets the quotes advice only when the word
	// is used bare. `bakground(...)` is a misspelt command and `plyer.x` a
	// misspelt name; quotes would make either one worse.
	function usedBare(word, text) {
		if (!text) return true;
		var rx = new RegExp('(^|[^\\w$.])' + word.replace(/\$/g, '\\$') + '(?![\\w$])\\s*(.?)', 'g');
		var m, seen = false;
		while ((m = rx.exec(text))) {
			seen = true;
			if (m[2] !== '(' && m[2] !== '.') return true;
		}
		return !seen;
	}
	function plainSentence(name, msg, text) {
		var m;
		if (msg === NO_CANVAS) return 'Your sketch needs a canvas first: inside setup(), write new Canvas(400, 400).';
		if (name === 'TypeError' && (m = /^Class constructor ([A-Za-z_$][\w$]*) cannot be invoked without 'new'$/.exec(msg))) {
			return 'Put the word new in front: new ' + m[1] + '(...).';
		}
		if (name === 'ReferenceError' && (m = /^([A-Za-z_$][\w$]*) is not defined$/.exec(msg)) && usedBare(m[1], text)) {
			return 'The word ' + m[1] + ' is not defined. If it is a colour or text, put quotes around it.';
		}
		return '';
	}
	// "It came up." The host keeps Submit shut from Run until this frame has
	// reported back one way or the other: an error (reportError), or this
	// message once the sketch's first frame has run clean -- or at once after
	// boot when there is no setup() for the engine to start, since no frame
	// will come. Without it a sketch that throws looked submittable: the host
	// marks the cards 400 ms after Run, and on a cold load the frame had not
	// said anything yet (5.1.25 with Check's pattern fallback, 2026-11-03; see
	// runPending in components/LessonWorkspace.tsx).
	var errored = false, cameUp = false;
	function reportCameUp() {
		if (errored || cameUp) return;
		cameUp = true;
		try { window.parent.postMessage({ source: 'preview-status', status: 'running' }, '*'); } catch (e) { /* parent gone */ }
	}
	window.__moshionCameUp = reportCameUp;
	function reportError(err, fallbackMsg, fbFile, fbLine, fbCol) {
		errored = true;
		var frame = parseStudentFrame(err && err.stack);
		var loc = frame;
		if (!loc && fbFile && (window.__previewSources || {})[fbFile]) {
			loc = { file: fbFile, line: fbLine || 0, col: fbCol || 0 };
		}
		var name = (err && err.name) || 'Error';
		var msg = (err && err.message) || fallbackMsg || String(err);
		var hint = '';
		if (name === 'SyntaxError' && !frame) {
			var wrapped = HOST_PREFIX.test(msg);
			msg = msg.replace(HOST_PREFIX, '');
			var code = (window.__previewSources || {})['sketch.js'];
			if (wrapped || sketchFailsToParse(code)) {
				if (!loc || !loc.line) {
					var at = sketchFailsToParse(code) ? locateTypo(code, msg) : null;
					loc = at ? { file: 'sketch.js', line: at, col: 0 } : null;
				}
				hint = loc && loc.line ? 'There is a typo near line ' + loc.line + ': ' + msg : 'There is a typo in your code: ' + msg;
			}
		} else {
			hint = plainSentence(name, msg, loc ? lineSnippet(loc.file, loc.line) : '');
		}
		var file = loc ? loc.file : null;
		var line = loc ? loc.line : null;
		var col = loc ? loc.col : null;
		try {
			window.parent.postMessage({
				source: 'preview-error',
				error: { name: name, message: msg, hint: hint, file: file, line: line, col: col, snippet: file ? lineSnippet(file, line) : '' }
			}, '*');
		} catch (e) { /* parent gone */ }
		var locStr = file ? file + ':' + line + (col ? ':' + col : '') : '';
		send('error', [name + ': ' + msg + (locStr ? '  (' + locStr + ')' : '')]);
		var el = document.getElementById('error');
		if (el) {
			el.style.display = 'block';
			el.textContent = (hint ? hint + '\n' : '') + name + ': ' + msg + (locStr ? '  @ ' + locStr : '');
		}
	}
	// "Script error." -- and why most engine errors never reach the window
	// error event at all.
	//
	// This frame is sandboxed without allow-same-origin, so it has an opaque
	// origin, and every <script src> it loads (planck, textures, the moSHion
	// engine) counts as CROSS-ORIGIN to it. A browser mutes an uncaught error
	// thrown inside a cross-origin script: the error event carries only the
	// message "Script error.", no error object, no file, no line. So when the
	// engine threw -- "new Canvas(w, h) must be called in setup()", a bad
	// argument to showGrid(), world.origin set too late -- the student saw
	// "Error: Script error." and nothing else. Measured 2026-11-02 on the
	// 5.1.11, 5.1.20, 5.1.22, 5.1.24 and 5.6.14 starters (none makes a canvas
	// yet). Errors thrown by the student's own code were never muted: the
	// sketch is an inline script, which the rule does not touch.
	//
	// Muting only applies to an error nobody caught. A try/catch gets the real
	// Error object, message and stack included. So the two ways the engine is
	// driven are caught here instead of left to the error event: the boot call
	// (setup(), and the canvas check after it) in the body script below, and
	// every animation frame (update/draw/drawTop, physics, render) through the
	// requestAnimationFrame wrapper below. Both report and stop -- the frame
	// that threw does not schedule the next one, exactly as before, so a
	// broken sketch freezes rather than spinning. Do NOT "fix" the muting with
	// allow-same-origin on the iframe (see components/MoshionPreview.tsx), and
	// do not add a crossorigin attribute to the engine tag without a CORS
	// header on every host: without one the engine would not load at all.
	//
	// What is left muted: an engine error thrown while the sketch's top-level
	// code runs (outside setup() and draw()). That cannot be caught without
	// changing how the sketch is loaded, so it gets a plain sentence instead.
	var reported = typeof WeakSet === 'function' ? new WeakSet() : null;
	function caught(err) {
		if (err && (typeof err === 'object' || typeof err === 'function') && reported) {
			if (reported.has(err)) return;
			try { reported.add(err); } catch (_) { /* frozen or exotic */ }
		}
		reportError(err, null);
	}
	window.__moshionReportError = caught;
	var MUTED_TOP = 'moSHion stopped while your code outside setup() and draw() was running, but the browser hid the reason. Move moSHion commands into setup() (after new Canvas(...)) or draw(), then Run again to see the real error.';
	var MUTED_ANY = 'moSHion stopped your sketch, but the browser hid the reason. Look at the moSHion command on the line you changed last: it may have been given a value it cannot use.';
	window.__moshionPhase = 'loading';
	function isMuted(e) {
		return !e.error && /^(Uncaught )?Script error\.?$/i.test(String(e.message || '')) && !e.filename && !e.lineno;
	}
	window.addEventListener('error', function(e) {
		if (e.error && reported && (typeof e.error === 'object' || typeof e.error === 'function') && reported.has(e.error)) return;
		if (isMuted(e)) {
			reportError(null, window.__moshionPhase === 'top' ? MUTED_TOP : MUTED_ANY);
			return;
		}
		reportError(e.error, e.message, e.filename, e.lineno, e.colno);
	});
	// See the "Script error." note above: every frame the engine runs comes
	// through here, so an error it throws is caught with its real message and
	// stack. The callback is only wrapped, never replaced or reordered, so a
	// sketch that does not throw runs exactly as it did. Installed before the
	// engine script loads, because the engine looks the function up by name.
	var nativeRaf = window.requestAnimationFrame;
	if (typeof nativeRaf === 'function') {
		window.requestAnimationFrame = function(cb) {
			if (typeof cb !== 'function') return nativeRaf.call(window, cb);
			return nativeRaf.call(window, function(t) {
				try {
					var out = cb(t);
					if (window.__moshionPhase === 'running') reportCameUp();
					return out;
				}
				catch (err) { caught(err); }
			});
		};
	}
	window.addEventListener('unhandledrejection', function(e) {
		var r = e.reason;
		var err = (r && r.stack) ? r : new Error(r && r.message ? r.message : String(r));
		reportError(err, 'Unhandled promise rejection');
	});

	// REPL: parent posts { source: 'preview-eval', id, expr }. We eval at
	// global scope and post back { source: 'preview-eval-result', id, ok, text }.
	// Indirect eval ( (0, eval) ) resolves through the global lexical env, so it
	// sees top-level `let`/`const`/`class` bindings declared by the student script.
	function inspect(v, depth) {
		depth = depth || 0;
		if (v === null) return 'null';
		if (v === undefined) return 'undefined';
		var t = typeof v;
		if (t === 'string') return JSON.stringify(v);
		if (t === 'number' || t === 'bigint' || t === 'boolean' || t === 'symbol') return String(v);
		if (t === 'function') return 'ƒ ' + (v.name || '(anonymous)') + '()';
		if (t !== 'object') return String(v);
		if (v instanceof Error) return v.stack || v.message;
		// Walk the class chain for a non-empty name so objects built from
		// anonymous subclasses still display as `Parent { … }`.
		var c = v.constructor;
		var name = '';
		while (c && c !== Function.prototype) {
			if (c.name) { name = c.name; break; }
			c = Object.getPrototypeOf(c);
		}
		var ctor = (name && name !== 'Object') ? name : '';
		if (depth >= 1) return ctor ? ctor + ' { … }' : '{…}';
		if (Array.isArray(v)) {
			var items = v.slice(0, 6).map(function(x) { return inspect(x, depth + 1); });
			if (v.length > 6) items.push('… +' + (v.length - 6));
			return '[' + items.join(', ') + ']';
		}
		var keys;
		try { keys = Object.keys(v); } catch (_) { return ctor ? ctor + ' { … }' : '{…}'; }
		var shown = keys.slice(0, 6);
		var pairs = shown.map(function(k) {
			var val;
			try { val = inspect(v[k], depth + 1); } catch (_) { val = '<unreadable>'; }
			return k + ': ' + val;
		});
		if (keys.length > 6) pairs.push('… +' + (keys.length - 6));
		return (ctor ? ctor + ' ' : '') + '{ ' + pairs.join(', ') + ' }';
	}
	window.addEventListener('message', function(e) {
		var d = e.data;
		if (!d || d.source !== 'preview-eval') return;
		var out, ok = true, text;
		try {
			out = (0, eval)(d.expr);
			text = inspect(out);
		} catch (x) {
			ok = false;
			text = (x && (x.stack || x.message)) || String(x);
		}
		try {
			window.parent.postMessage({ source: 'preview-eval-result', id: d.id, ok: ok, text: text }, '*');
		} catch (_) { /* parent gone */ }
	});
})();
</script>
<script src="./planck.min.js"></script>
<script src="./textures/textures.js"></script>
<script src="./moshion.js"></script>
<script src="./extras.js"></script>
</head>
<body>
<div id="error"></div>
<div id="empty">Click Run to execute your sketch.</div>
<script>
// Read student code from ?code=<base64url>, inject as a <script> so declarations become globals
(function() {
	// Never execute ?code= as a top-level document. See the matching guard in
	// public/reshape/runner.html for the full reasoning: embedded, this frame is
	// sandboxed into an opaque origin; opened directly by a link, the injected
	// script would run on the app's origin with the viewer's SameSite=Lax
	// session cookie available to any same-origin fetch.
	if (window.top === window.self) {
		document.body.innerHTML = '';
		var warn = document.createElement('p');
		warn.style.cssText = 'font:14px system-ui;color:#f8f8f2;background:#282a36;margin:0;padding:24px';
		warn.textContent = 'This preview only runs inside shCode. Open a lesson or the docs instead.';
		document.body.appendChild(warn);
		return;
	}
	var params = new URLSearchParams(location.search);
	// ?fit=1 -- scale the sketch up to fill this frame (see the CSS above).
	if (params.get('fit')) document.body.classList.add('fit');
	var encoded = params.get('code');
	if (!encoded) return;
	var code;
	try {
		var b64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
		while (b64.length % 4) b64 += '=';
		code = decodeURIComponent(escape(atob(b64)));
	} catch (e) {
		console.error('Failed to decode sketch: ' + (e.message || e));
		return;
	}
	document.getElementById('empty').remove();
	// Stash source so the error handler can look up the offending line
	window.__previewSources = { 'sketch.js': code };

	function inject() {
		var s = document.createElement('script');
		// The //# sourceURL pragma makes V8 attribute thrown errors to "sketch.js"
		// with line numbers relative to the student's source instead of this host doc.
		s.textContent = code + '\n//# sourceURL=sketch.js';
		window.__moshionPhase = 'top';
		document.head.appendChild(s);
		window.__moshionPhase = 'boot';
		// The engine's auto-boot already ran and found no setup(); tell it to
		// look again now that the sketch is actually here. Caught rather than
		// left to the error event: the engine's own checks (a missing canvas)
		// throw from the engine script, and uncaught they arrive muted as
		// "Script error." -- see the note in the head script.
		try {
			if (typeof window._moshionAutoBoot === 'function') window._moshionAutoBoot();
		} catch (err) {
			if (typeof window.__moshionReportError === 'function') window.__moshionReportError(err);
			else throw err;
		}
		window.__moshionPhase = 'running';
		// No setup(), so the engine never started and no frame will come: the
		// sketch is as far up as it gets. (A started engine reports from its
		// first frame instead -- see the requestAnimationFrame wrapper.)
		if (!window._moshionStarted && typeof window.__moshionCameUp === 'function') window.__moshionCameUp();
	}

	// Saves. Sandboxed into an opaque origin, this frame cannot so much as
	// READ window.localStorage -- it throws SecurityError -- so the host page
	// keeps the store and hands us a copy. Wait for it BEFORE running the
	// sketch: moSHion's getItem() is synchronous, and a save that arrived after
	// setup() had already read it would be worse than no save at all.
	//
	// A sketch that saves to 'remote' (#97, extras.js save/load) needs its
	// account's saves too, which the page has to fetch first. The page answers
	// 'preview-storage-wait' at once, which stops the asking and swaps the short
	// no-host fallback for a long one; the init that follows carries `remote`
	// (the map) and `remoteState` ('ready' | 'signed-out' | 'offline').
	var started = false;
	function start(store, remote, remoteState) {
		if (started) return;
		started = true;
		clearInterval(ask);
		clearTimeout(fallback);
		window.removeEventListener('message', onInit);
		window.__moshionStorage = (store && typeof store === 'object') ? store : {};
		if (remoteState) {
			window.__moshionRemoteState = remoteState;
			window.__moshionRemote = (remote && typeof remote === 'object') ? remote : {};
		}
		inject();
	}
	function onInit(e) {
		var d = e.data;
		if (!d) return;
		if (d.source === 'preview-storage-init') start(d.data, d.remote, d.remoteState);
		else if (d.source === 'preview-storage-wait' && !started) {
			clearInterval(ask);
			clearTimeout(fallback);
			fallback = setTimeout(function () { start({}, null, 'offline'); }, 8000);
		}
	}
	function request() {
		try { window.parent.postMessage({ source: 'preview-storage-request' }, '*'); }
		catch (e) { /* no parent */ }
	}
	window.addEventListener('message', onInit);
	// Retried, because the host's listener is attached in a React effect and
	// may not exist yet when this frame finishes loading. A host that never
	// answers -- one that has not implemented the bridge -- gets an empty
	// store after the timeout rather than a sketch that never starts.
	var ask = setInterval(request, 40);
	request();
	var fallback = setTimeout(function () { start({}); }, 400);
})();
</script>
</body>
</html>
