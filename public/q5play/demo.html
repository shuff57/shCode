<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>q5play demo</title>
	<style>
		html, body { margin: 0; padding: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; }
		body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
		canvas { display: block; }
		#hint { text-align: center; font-size: 14px; opacity: 0.7; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"box2d3-wasm": "./Box2D.deluxe.mjs"
		}
	}
	</script>
	<script src="./q5.js"></script>
	<script type="module" src="./q5play.js"></script>
</head>
<body>
	<div id="hint">Left/Right to move, Space to jump. If you see a blue square on a gray floor, q5play works.</div>
	<script>
		let player, ground;

		function setup() {
			new Canvas(400, 400);
			world.gravity.y = 10;

			player = new Sprite(200, 100, 40, 40);
			player.color = 'deepskyblue';

			ground = new Sprite(200, 380, 400, 20, 'static');
			ground.color = 'gray';
		}

		function update() {
			if (kb.pressing('left')) player.vel.x = -5;
			else if (kb.pressing('right')) player.vel.x = 5;

			if (kb.presses(' ') && player.colliding(ground)) {
				player.vel.y = -8;
			}
		}

		function draw() {
			background('#222');
		}
	</script>
</body>
</html>
