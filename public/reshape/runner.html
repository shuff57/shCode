<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JSCAD runner</title>
<style>
	html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #36333a; color: #f8f8f2; font-family: system-ui, sans-serif; }
	#__jscadViewer { width: 100vw; height: 100vh; }
	#__jscadViewer canvas { display: block; }
	#__jscadStatus { position: fixed; bottom: 8px; left: 8px; color: #6272a4; font: 12px/1.4 monospace; pointer-events: none; z-index: 10; }
	#__jscadSave { position: fixed; top: 8px; right: 8px; display: none; gap: 6px; z-index: 20; }
	#__jscadSave button { font: 12px/1 'Fira Code', Consolas, monospace; color: #f8f8f2; background: #44475a; border: 1px solid #6272a4; border-radius: 4px; padding: 7px 11px; cursor: pointer; }
	#__jscadSave button:hover { background: #6272a4; }
	#__jscadSave button:disabled { opacity: 0.45; cursor: default; }
	#__jscadSaveNote { position: fixed; top: 40px; right: 8px; color: #50fa7b; font: 11px/1.4 monospace; text-align: right; pointer-events: none; z-index: 20; }
	#__jscadError { position: fixed; top: 0; left: 0; right: 0; background: rgba(220,38,38,0.92); color: #fff; padding: 8px 12px; font: 12px/1.4 monospace; white-space: pre-wrap; display: none; z-index: 100; }
</style>
<script>
// Pipe console + errors to parent (matches the existing preview-console protocol).
// Student source is stashed on window.__previewSources so the error handler can
// look up the offending source line for richer error messages.
(function() {
	function send(type, args) {
		try {
			var safe = Array.prototype.slice.call(args).map(function(a) {
				if (a instanceof Error) return a.stack || a.message;
				if (typeof a === 'object') { try { return JSON.parse(JSON.stringify(a)); } catch(e){ return String(a); } }
				return a;
			});
			window.parent.postMessage({ source: 'preview-console', type: type, args: safe }, '*');
		} catch (e) { /* parent gone */ }
	}
	['log','warn','error','info'].forEach(function(t) {
		var orig = console[t];
		console[t] = function() { send(t, arguments); orig.apply(console, arguments); };
	});

	// WebKit ignores the //# sourceURL pragma on an injected script and blames
	// the DOCUMENT instead, so its stack reads "main@…/runner.html:2:19" and
	// parseStudentFrame — which needs a *.js name it recognises — finds nothing.
	// The line and column are not lost, they are on the Error itself under
	// JavaScriptCore's own spelling. Measured 2026-08-22: webkit gives
	// line 2 / column 19 where chromium gives 2:3, same line, different column
	// convention (JSC points at the identifier, V8 at the start of the call).
	//
	// The guard matters more than the fallback. Without it a throw from inside
	// a vendored bundle would be reported at "script.js:<some line>", pointing a
	// student at their own code for a fault that is not theirs. Only student
	// source lives outside ./lib/, and the runner injects exactly one such file.
	function engineFrame(err) {
		if (!err) return null;
		if (!Object.prototype.hasOwnProperty.call(window.__previewSources || {}, 'script.js')) return null;

		// (a) Walk the stack for the first frame that is NOT inside a vendored
		// bundle. When the library throws because of something the student
		// passed it, that frame is the student's calling line — which is the
		// answer chromium and firefox already give, and the one worth matching.
		var lines = String(err.stack || '').split('\n');
		var rx = /:(\d+):(\d+)\)?\s*$/;
		for (var i = 0; i < lines.length; i++) {
			if (lines[i].indexOf('/lib/') !== -1) continue;
			var m = rx.exec(lines[i].replace(/\s+$/, ''));
			if (m) return { file: 'script.js', line: parseInt(m[1], 10), col: parseInt(m[2], 10) };
		}

		// (b) No usable stack: JavaScriptCore still carries the location on the
		// Error itself. Skip it when it points into a bundle, so a library fault
		// is left unattributed rather than pinned on the student.
		var src = String(err.sourceURL || err.fileName || '');
		if (src.indexOf('/lib/') !== -1) return null;
		var line = (typeof err.line === 'number') ? err.line : err.lineNumber;
		var col = (typeof err.column === 'number') ? err.column : err.columnNumber;
		if (typeof line !== 'number' || !line) return null;
		return { file: 'script.js', line: line, col: (typeof col === 'number') ? col : 0 };
	}

	function parseStudentFrame(stack) {
		if (!stack) return null;
		var sources = window.__previewSources || {};
		var lines = String(stack).split('\n');
		var rx = /([A-Za-z_][\w./-]*\.js):(\d+):(\d+)/;
		for (var i = 0; i < lines.length; i++) {
			var m = rx.exec(lines[i]);
			if (m && Object.prototype.hasOwnProperty.call(sources, m[1])) {
				return { file: m[1], line: parseInt(m[2], 10), col: parseInt(m[3], 10) };
			}
		}
		return null;
	}
	function lineSnippet(file, line) {
		var src = (window.__previewSources || {})[file];
		if (!src || !line) return '';
		var arr = src.split('\n');
		return (arr[line - 1] || '').replace(/^\s+/, '').slice(0, 200);
	}
	function reportError(err, fallbackMsg, fbFile, fbLine, fbCol) {
		var loc = parseStudentFrame(err && err.stack) || engineFrame(err);
		if (!loc && fbFile && (window.__previewSources || {})[fbFile]) {
			loc = { file: fbFile, line: fbLine || 0, col: fbCol || 0 };
		}
		var name = (err && err.name) || 'Error';
		var msg = (err && err.message) || fallbackMsg || String(err);
		var file = loc ? loc.file : null;
		var line = loc ? loc.line : null;
		var col = loc ? loc.col : null;
		try {
			window.parent.postMessage({
				source: 'preview-error',
				error: { name: name, message: msg, file: file, line: line, col: col, snippet: file ? lineSnippet(file, line) : '' }
			}, '*');
		} catch (e) { /* parent gone */ }
		var locStr = file ? file + ':' + line + (col ? ':' + col : '') : '';
		send('error', [name + ': ' + msg + (locStr ? '  (' + locStr + ')' : '')]);
		var el = document.getElementById('__jscadError');
		if (el) {
			el.style.display = 'block';
			el.textContent = name + ': ' + msg + (locStr ? '  @ ' + locStr : '');
		}
	}
	// Shown for problems that are not a thrown Error (no main(), main() returned
	// nothing). Same overlay, and it still reaches the parent as a preview-error
	// so the lesson's runtime-error banner lights up.
	window.__previewFail = function(msg) {
		reportError({ name: 'Error', message: msg }, msg);
	};
	window.addEventListener('error', function(e) {
		reportError(e.error, e.message, e.filename, e.lineno, e.colno);
	});
	window.addEventListener('unhandledrejection', function(e) {
		var r = e.reason;
		var err = (r && r.stack) ? r : new Error(r && r.message ? r.message : String(r));
		reportError(err, 'Unhandled promise rejection');
	});

	// REPL: parent posts { source: 'preview-eval', id, expr }. We eval at
	// global scope and post back { source: 'preview-eval-result', id, ok, text }.
	// Indirect eval ( (0, eval) ) resolves through the global lexical env, so it
	// sees top-level `let`/`const`/`class` bindings declared by the student script.
	function inspect(v, depth) {
		depth = depth || 0;
		if (v === null) return 'null';
		if (v === undefined) return 'undefined';
		var t = typeof v;
		if (t === 'string') return JSON.stringify(v);
		if (t === 'number' || t === 'bigint' || t === 'boolean' || t === 'symbol') return String(v);
		if (t === 'function') return 'ƒ ' + (v.name || '(anonymous)') + '()';
		if (t !== 'object') return String(v);
		if (v instanceof Error) return v.stack || v.message;
		// Walk the class chain for a non-empty name so objects built from
		// anonymous subclasses still display as `Parent { … }`.
		var c = v.constructor;
		var name = '';
		while (c && c !== Function.prototype) {
			if (c.name) { name = c.name; break; }
			c = Object.getPrototypeOf(c);
		}
		var ctor = (name && name !== 'Object') ? name : '';
		if (depth >= 1) return ctor ? ctor + ' { … }' : '{…}';
		if (Array.isArray(v)) {
			var items = v.slice(0, 6).map(function(x) { return inspect(x, depth + 1); });
			if (v.length > 6) items.push('… +' + (v.length - 6));
			return '[' + items.join(', ') + ']';
		}
		var keys;
		try { keys = Object.keys(v); } catch (_) { return ctor ? ctor + ' { … }' : '{…}'; }
		var shown = keys.slice(0, 6);
		var pairs = shown.map(function(k) {
			var val;
			try { val = inspect(v[k], depth + 1); } catch (_) { val = '<unreadable>'; }
			return k + ': ' + val;
		});
		if (keys.length > 6) pairs.push('… +' + (keys.length - 6));
		return (ctor ? ctor + ' ' : '') + '{ ' + pairs.join(', ') + ' }';
	}
	window.addEventListener('message', function(e) {
		var d = e.data;
		if (!d || d.source !== 'preview-eval') return;
		var out, ok = true, text;
		try {
			out = (0, eval)(d.expr);
			text = inspect(out);
		} catch (x) {
			ok = false;
			text = (x && (x.stack || x.message)) || String(x);
		}
		try {
			window.parent.postMessage({ source: 'preview-eval-result', id: d.id, ok: ok, text: text }, '*');
		} catch (_) { /* parent gone */ }
	});
})();
</script>
<!-- Vendored, not a CDN. Both bundles are UMD and must load BEFORE the shim
     below declares window.module — the UMD prelude checks for `module` first
     and would export into it instead of onto window. -->
<script src="./lib/jscad-modeling.min.js"></script>
<script src="./lib/jscad-regl-renderer.min.js"></script>
<!-- The serializers behind the Save buttons: @jscad/{stl,3mf,obj}-serializer,
     bundled to one IIFE (window.jscadIO) with @jscad/modeling resolved to the
     copy already loaded above rather than a second one. Vendored, like the two
     bundles above; nothing here reaches a CDN. -->
<script src="./lib/jscad-io.min.js"></script>
</head>
<body>
<!-- Prefixed on purpose. A named element becomes a window property, and
     the shim below refuses to install a bare name over anything already
     on window — so plain id="viewer" would be the runner quietly
     shadowing any future JSCAD export of that name. -->
<div id="__jscadError"></div>
<div id="__jscadViewer"></div>
<div id="__jscadStatus">Loading…</div>
<!-- Hidden until main() has returned something drawable, so the buttons can
     never write a file for a model that failed to build. -->
<div id="__jscadSave">
	<button type="button" data-format="stl">Save STL</button>
	<button type="button" data-format="3mf">Save 3MF</button>
	<button type="button" data-format="obj">Save OBJ</button>
	<button type="button" data-format="svg">Save SVG</button>
</div>
<div id="__jscadSaveNote"></div>
<script>
// ---------------------------------------------------------------------------
// Additive JSCAD scope shim.
//
// Every real name keeps working exactly the way it does on jscad.app:
//     require('@jscad/modeling')       -> the whole module object
//     primitives.cube({ size: 10 })    -> namespaced call
//     transforms.translate([0,0,5], s) -> namespaced call
//     booleans.subtract(a, b)          -> namespaced call
//     module.exports = { main }        -> the standard export
// On top of that — and only on top of it — every module and every member of
// every module is also copied onto window, so a beginner can write
// `cube({ size: 10 })` on line 1 with no import. Nothing here renames,
// replaces, or wraps anything: a file that uses the require/module.exports
// form still pastes into https://jscad.app/ and runs there unchanged.
//
// PRECEDENCE — highest wins. Two names genuinely collide inside
// @jscad/modeling itself, so the order is pinned here rather than left to
// whatever order the bundle happens to enumerate keys in:
//
//   1. The student's own top-level declarations. This shim writes to window
//      BEFORE script.js runs, so `function cube() {}` and `var cube = …`
//      overwrite the global, and `const cube` / `let cube` / `class cube`
//      shadow it with a lexical global binding. A student's variable always
//      beats a JSCAD name.
//   2. Anything already on window — browser built-ins and this runner's own
//      helpers. Never clobbered. If a future JSCAD version adds a name that
//      collides with one, the bare name is simply not installed (it lands in
//      window.__jscadBareNamesSkipped) and the namespaced call still works.
//   3. The 15 module names, in MODULE_ORDER below.
//   4. Module members. First module in MODULE_ORDER wins.
//
// The two real collisions in @jscad/modeling@2.13.0, both resolved by rule 3:
//   utils     -> the top-level `utils` module (degToRad, flatten, …), NOT
//                `maths.utils`. maths.utils is still reachable as maths.utils.
//   minkowski -> the top-level `minkowski` module ({ minkowskiSum }), NOT the
//                `booleans.minkowski` function. booleans.minkowski is still
//                reachable as booleans.minkowski, and minkowskiSum is bare.
// ---------------------------------------------------------------------------
(function() {
	var jscad = window.jscadModeling;
	var statusEl = document.getElementById('__jscadStatus');
	if (!jscad) {
		statusEl.textContent = 'Failed to load @jscad/modeling from /reshape/lib/ — try refreshing.';
		return;
	}

	// Declaration order of src/index.js in @jscad/modeling@2.13.0. Pinned so a
	// library upgrade cannot silently change which module wins a collision.
	var MODULE_ORDER = [
		'colors', 'curves', 'geometries', 'maths', 'measurements', 'primitives',
		'text', 'utils', 'booleans', 'expansions', 'extrusions', 'hulls',
		'minkowski', 'modifiers', 'transforms'
	];

	// ---- CommonJS surface (unchanged from the real API) ----
	window.module = { exports: {} };
	window.exports = window.module.exports;

	// Resolves the paths @jscad/modeling really publishes:
	//   '@jscad/modeling'                        -> whole module
	//   '@jscad/modeling/src/primitives'         -> primitives
	//   '@jscad/modeling/src/operations/booleans' -> booleans
	//   '@jscad/modeling/primitives'             -> primitives
	function resolveModule(name) {
		name = String(name);
		if (name === '@jscad/modeling') return jscad;
		var m = /^@jscad\/modeling\/(?:src\/)?(.+)$/.exec(name);
		if (!m) return undefined;
		var parts = m[1].replace(/\.js$/, '').split('/');
		if (parts[0] === 'operations') parts.shift();
		var cur = jscad;
		for (var i = 0; i < parts.length; i++) {
			if (cur == null || !(parts[i] in cur)) return undefined;
			cur = cur[parts[i]];
		}
		return cur;
	}
	window.require = function(name) {
		var mod = resolveModule(name);
		if (mod === undefined) {
			throw new Error("Cannot find module '" + name + "'. This sandbox provides '@jscad/modeling'.");
		}
		return mod;
	};

	// ---- Bare-name scope (the additive half) ----
	//
	// Two names are SUPPOSED to be skipped: `utils` and `minkowski` are claimed
	// by both a top-level module and a module member, and rule 3 gives them to
	// the module. Everything else that gets skipped is a bare name a student
	// expected and did not get, so it is reported rather than filed away in a
	// global nobody reads. A library upgrade that collides with a browser
	// built-in now says so in the console on the very first run.
	var KNOWN_COLLISIONS = ['utils', 'minkowski'];
	var skipped = [];
	var lost = [];
	function install(name, value) {
		if (name in window) {                                   // rules 2, 3, 4
			skipped.push(name);
			if (KNOWN_COLLISIONS.indexOf(name) === -1) lost.push(name);
			return;
		}
		window[name] = value;
	}
	MODULE_ORDER.forEach(function(n) {                        // rule 3
		if (jscad[n] !== undefined) install(n, jscad[n]);
	});
	MODULE_ORDER.forEach(function(n) {                        // rule 4
		var mod = jscad[n];
		if (!mod) return;
		Object.keys(mod).forEach(function(k) { install(k, mod[k]); });
	});
	window.__jscadBareNamesSkipped = skipped;
	window.__jscadBareNamesLost = lost;
	if (lost.length) {
		console.warn(
			'JSCAD: ' + lost.length + ' name(s) could not be added to scope because ' +
			'something already owns them here: ' + lost.join(', ') + '. Reach them ' +
			'through their module instead, e.g. primitives.' + lost[0] + '(...).'
		);
	}
})();
</script>
<!-- reSHape: the simplified names the course teaches in Q3 (box, ball, tube, …).
     Additive, in its own file, loaded AFTER the shim above so it can see every
     real name and refuse to overwrite one, and BEFORE the ?code= injection
     below so a student's own declarations still win. Its banner explains the
     design; scripts/reshape-simple-checks.mjs holds its expectations. -->
<script src="./reshape.js"></script>
<script src="./svg.js"></script>
<script>
// Read student code from ?code=<base64url> (written by encodeCode() in
// components/MoshionPreview.tsx) and inject it as a <script> so its top-level
// declarations become real globals.
(function() {
	// Never execute ?code= as a top-level document.
	//
	// Embedded by ReshapePreview this frame carries sandbox="allow-scripts"
	// WITHOUT allow-same-origin, so student code runs in an opaque origin and
	// cannot touch the app. Opened directly — a link someone was sent — there
	// is no iframe and no sandbox, and the injected script would run on the
	// app's own origin. The session cookie is SameSite=Lax, which IS sent on a
	// top-level GET navigation, so a same-origin fetch to /api/* would carry a
	// logged-in teacher's session. HttpOnly does not help: the payload never
	// needs to read the cookie, the browser attaches it.
	//
	// This is defence in depth behind the sandbox attribute, not a substitute
	// for it. Both are needed: the attribute can be dropped by an edit to the
	// component, and this guard cannot see whether the attribute is present.
	if (window.top === window.self) {
		document.body.innerHTML = '';
		var warn = document.createElement('p');
		warn.style.cssText = 'font:14px system-ui;color:#f8f8f2;background:#282a36;margin:0;padding:24px';
		warn.textContent = 'This preview only runs inside shCode. Open a lesson or the docs instead.';
		document.body.appendChild(warn);
		return;
	}
	var params = new URLSearchParams(location.search);
	var encoded = params.get('code');
	if (!encoded) return;
	var code;
	try {
		var b64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
		while (b64.length % 4) b64 += '=';
		code = decodeURIComponent(escape(atob(b64)));
	} catch (e) {
		console.error('Failed to decode your program: ' + (e.message || e));
		return;
	}
	// Stash source so the error handler can look up the offending line
	window.__previewSources = { 'script.js': code };
	var s = document.createElement('script');
	// The //# sourceURL pragma makes V8 attribute thrown errors to "script.js"
	// with line numbers relative to the student's source instead of this host
	// doc. The completion flag is set from inside the injected script, so a
	// throw anywhere in it leaves the flag false and the renderer stands down.
	s.textContent = code + '\n;window.__jscadScriptCompleted = true;\n//# sourceURL=script.js';
	document.head.appendChild(s);
})();
</script>
<script>
// ---------------------------------------------------------------------------
// Save STL / 3MF / OBJ.
//
// The renderer draws a model; this is what gets one OUT. The serializers are
// the real @jscad ones (window.jscadIO, vendored above), so the bytes written
// here are byte-for-byte what jscad.app's own export writes — the docs can say
// "STL forgets colour, 3MF keeps it" and a student can check it.
//
// Exposed as one function so the draw path below can turn saving on only after
// main() has actually produced geometry.
// ---------------------------------------------------------------------------
(function() {
	var bar = document.getElementById('__jscadSave');
	var note = document.getElementById('__jscadSaveNote');
	var solids = null;

	// Each entry: how to serialize, and what to call the file. `binary: true`
	// is the STL flavour every slicer expects — ASCII STL is ~5x the bytes for
	// the same triangles.
	var FORMATS = {
		stl: { name: 'model.stl', mime: 'application/sla',
		       run: function(s) { return jscadIO.stlSerializer.serialize({ binary: true }, s); } },
		'3mf': { name: 'model.3mf', mime: 'application/vnd.ms-package.3dmanufacturing-3dmodel+xml',
		       run: function(s) { return jscadIO.m3fSerializer.serialize({}, s); } },
		obj: { name: 'model.obj', mime: 'text/plain',
		       run: function(s) { return jscadIO.objSerializer.serialize({}, s); } },
		// The only format here that is not a 3D mesh, and the only way a 2D
		// design gets out of the app at all: stl/3mf/obj all serialize polygons,
		// and a geom2 has none. §8.2 and §8.3 are entirely 2D.
		svg: { name: 'design.svg', mime: 'image/svg+xml',
		       run: function(s) {
		           var out = reshapeSvg.serialize(jscadModeling, s);
		           if (out === null) {
		               throw new Error('this design has no flat shapes in it. SVG is for 2D ' +
		                   'outlines — save STL for a solid, or extrude a 2D shape first.');
		           }
		           return [out];
		       } }
	};

	function kb(bytes) { return bytes < 1024 ? bytes + ' bytes' : (bytes / 1024).toFixed(1) + ' KB'; }

	function save(key) {
		var fmt = FORMATS[key];
		if (!fmt || !solids) return;
		var blob;
		try {
			blob = new Blob(fmt.run(solids), { type: fmt.mime });
		} catch (e) {
			window.__previewFail('Could not write the ' + key.toUpperCase() + ' file: ' + (e.message || e));
			return;
		}
		var url = URL.createObjectURL(blob);
		var a = document.createElement('a');
		a.href = url;
		a.download = fmt.name;
		document.body.appendChild(a);
		a.click();
		document.body.removeChild(a);
		// Revoked on a timer, not immediately: Safari reads the blob after the
		// click returns, and a revoked URL there saves a 0-byte file.
		setTimeout(function() { URL.revokeObjectURL(url); }, 30000);
		note.textContent = 'saved ' + fmt.name + ' — ' + kb(blob.size);
		console.log('Saved ' + fmt.name + ' (' + kb(blob.size) + ')');
	}

	if (bar) {
		bar.addEventListener('click', function(ev) {
			var key = ev.target && ev.target.getAttribute && ev.target.getAttribute('data-format');
			if (key) save(key);
		});
	}

	// Called from draw() once there is something real to write.
	window.__jscadEnableSaving = function(geometry) {
		if (!window.jscadIO) return;   // bundle missing; leave the bar hidden
		solids = Array.isArray(geometry) ? geometry : [geometry];
		if (bar) bar.style.display = 'flex';
	};
})();
</script>
<script>
// Find main(), run it, and put the result on screen.
(function() {
	var statusEl = document.getElementById('__jscadStatus');
	var container = document.getElementById('__jscadViewer');
	var jscad = window.jscadModeling;
	var regl = window.jscadReglRenderer;

	function fail(msg) {
		statusEl.textContent = '';
		window.__previewFail(msg);
	}

	if (!jscad || !regl) {
		fail('Failed to load the JSCAD libraries from /reshape/lib/. Try refreshing the page.');
		return;
	}
	if (!window.__previewSources) { statusEl.textContent = ''; return; }  // nothing submitted
	if (!window.__jscadScriptCompleted) { statusEl.textContent = ''; return; }  // threw; already reported

	// main() may be exported, or just declared. `var`/`function main` lands on
	// window; `const`/`let`/`class main` creates a lexical global that window
	// cannot see, which is what the indirect eval is for.
	function findMain() {
		var exp = window.module && window.module.exports;
		if (exp && typeof exp.main === 'function') return exp.main;
		if (typeof exp === 'function') return exp;
		try {
			var f = (0, eval)('typeof main !== "undefined" ? main : undefined');
			if (typeof f === 'function') return f;
		} catch (e) { /* not declared */ }
		return null;
	}

	// jscad.app calls main(params). The declared list is published to the parent
	// so it can draw a Dimensions panel; the defaults are what the first run uses.
	function paramDefs() {
		var defs = null;
		var exp = window.module && window.module.exports;
		if (exp && typeof exp.getParameterDefinitions === 'function') defs = exp.getParameterDefinitions;
		if (!defs) {
			try {
				var g = (0, eval)('typeof getParameterDefinitions !== "undefined" ? getParameterDefinitions : undefined');
				if (typeof g === 'function') defs = g;
			} catch (e) { /* not declared */ }
		}
		if (!defs) return [];
		try { return defs() || []; } catch (e) { return []; }
	}

	function initialOf(d) {
		if (!d || d.name === undefined) return undefined;
		if (d.initial !== undefined) return d.initial;
		if (d.default !== undefined) return d.default;
		return undefined;
	}

	function defaultParams() {
		var params = {};
		var list = paramDefs();
		for (var i = 0; i < list.length; i++) {
			var v = initialOf(list[i]);
			if (v !== undefined) params[list[i].name] = v;
		}
		return params;
	}

	var mainFn = findMain();
	if (!mainFn) {
		fail('No main() function found.\n\nYour program needs a function called main that returns a shape:\n\n  function main() {\n    return cube({ size: 10 })\n  }\n\n(Adding "module.exports = { main }" is optional here — it is what lets the same file run on jscad.app.)');
		return;
	}

	// Drag handles: the parent knows the model and sends points in world space,
	// the runner owns the camera and projects them. Neither has to learn the
	// other's half, and nothing ever hit-tests a mesh.
	var anchors = [];
	var anchorsDirty = false;
	var projectAnchors = null;

	// Set by render() once regl is up. Swapping renderOptions.entities is enough
	// to change what is on screen — the rAF loop re-reads it every frame — so a
	// parameter change never reloads the iframe or re-initialises the renderer.
	var swapGeometry = null;

	// Hand the declared dimensions to the parent panel. Serialised through JSON
	// first: a def may carry a function (jscad allows it) and postMessage throws
	// DataCloneError on one, which would take the whole run down with it.
	var liveParams = defaultParams();
	try {
		window.parent.postMessage({
			source: 'reshape-params',
			defs: JSON.parse(JSON.stringify(paramDefs(), function(k, v) {
				return typeof v === 'function' ? undefined : v;
			})),
			values: liveParams
		}, '*');
	} catch (_) { /* parent gone, or nothing serialisable */ }


	var rebuildPending = false;

	function rebuild(params) {
		for (var k in params) { if (Object.prototype.hasOwnProperty.call(params, k)) liveParams[k] = params[k]; }
		// The panel is on screen before the first render finishes. An edit made in
		// that window used to merge into liveParams and then vanish, because the
		// first build had already been handed the old values — panel and model
		// disagreeing, silently, until the field was touched again.
		if (typeof mainFn !== 'function' || !swapGeometry) { rebuildPending = true; return; }
		var t0 = (window.performance && performance.now) ? performance.now() : 0;
		var out;
		try {
			out = mainFn(liveParams);
		} catch (e) {
			rebuildFailed(e);
			return;
		}
		if (out && typeof out.then === 'function') {
			out.then(function(g) { applyRebuild(g, t0); }, rebuildFailed);
		} else {
			applyRebuild(out, t0);
		}
	}

	// subtract() that removes everything hands back a geom3 object with no
	// polygons in it — truthy, not an array, and indistinguishable from a real
	// solid until you count. Anything unrecognised counts as drawable so an
	// unfamiliar geometry type is never silently reported as nothing.
	function isEmptyGeometry(g) {
		var list = Array.isArray(g) ? g : [g];
		if (list.length === 0) return true;
		var geoms = jscad.geometries || {};
		var total = 0;
		for (var i = 0; i < list.length; i++) {
			var item = list[i];
			if (!item) continue;
			try {
				if (geoms.geom3 && geoms.geom3.isA(item)) total += geoms.geom3.toPolygons(item).length;
				else if (geoms.geom2 && geoms.geom2.isA(item)) total += geoms.geom2.toSides(item).length;
				else total += 1;
			} catch (e) { total += 1; }
		}
		return total === 0;
	}

	// Throwing and returning nothing are the same thing to a student: the numbers
	// in the panel no longer describe the shape on screen. Report both.
	function rebuildFailed(e) {
		window.dispatchEvent(new ErrorEvent('error', { error: e, message: e && e.message, filename: 'script.js' }));
		try {
			window.parent.postMessage({ source: 'reshape-rebuilt', ms: 0, failed: true }, '*');
		} catch (_) { /* parent gone */ }
	}

	function applyRebuild(geometry, t0) {
		// An empty result is a real answer, not a no-op: with these dimensions the
		// cut removed everything. Leaving the previous model on screen would show a
		// shape the numbers no longer describe.
		if (!geometry || isEmptyGeometry(geometry)) {
			try {
				window.parent.postMessage({ source: 'reshape-rebuilt', ms: 0, empty: true }, '*');
			} catch (_) { /* parent gone */ }
			return;
		}
		try {
			swapGeometry(geometry);
			window.__jscadEnableSaving(geometry);
		} catch (e) {
			fail('Render error: ' + (e.message || e));
			return;
		}
		var t1 = (window.performance && performance.now) ? performance.now() : 0;
		try {
			window.parent.postMessage({ source: 'reshape-rebuilt', ms: t1 - t0 }, '*');
		} catch (_) { /* parent gone */ }
	}

	window.addEventListener('message', function(e) {
		var d = e.data;
		if (d && d.source === 'reshape-set-anchors') {
			anchors = Array.isArray(d.anchors) ? d.anchors : [];
			anchorsDirty = true;
			if (projectAnchors) projectAnchors();
			return;
		}
		if (d && d.source === 'reshape-set-savebar') {
			// Build mode floats the app toolbar over the top of this frame, so
			// the Save bar would sit under it. Drop it below the ribbon -- or,
			// when the parent asks, park it in the bottom-right corner where
			// nothing else lives.
			var bar = document.getElementById('__jscadSave');
			var note = document.getElementById('__jscadSaveNote');
			if (bar) {
				if (d.bottom) {
					bar.style.top = 'auto';
					bar.style.bottom = '8px';
				} else {
					bar.style.top = (d.offset || 0) + 'px';
					bar.style.bottom = 'auto';
				}
			}
			if (note) {
				if (d.bottom) {
					note.style.top = 'auto';
					note.style.bottom = '40px';
				} else {
					note.style.top = (d.offset || 0) + 32 + 'px';
					note.style.bottom = 'auto';
				}
			}
			return;
		}
		if (!d || d.source !== 'reshape-set-params' || !d.params) return;
		// ponytail: every message is applied in order. The sender coalesces to one
		// per frame and rebuilds run ~20ms, so nothing queues today. If a heavy
		// model ever pushes a rebuild past a frame, drop to latest-wins here.
		rebuild(d.params);
	});

	function draw(geometry) {
		if (!geometry || (Array.isArray(geometry) && geometry.length === 0)) {
			fail('main() returned nothing. Make sure you return a shape.\n\nExample:  return cube({ size: 10 })');
			return;
		}
		statusEl.textContent = 'Rendering…';
		try {
			render(geometry);
			statusEl.textContent = '';
			window.__jscadEnableSaving(geometry);
		} catch (e) {
			fail('Render error: ' + (e.message || e));
		}
	}

	// Largest edge of the model's bounding box, across every solid it returns.
	function modelSpan(solids) {
		var measure = jscad.measurements && jscad.measurements.measureBoundingBox;
		if (!measure) return 200;
		var span = 0;
		for (var i = 0; i < solids.length; i++) {
			var box;
			try { box = measure(solids[i]); } catch (e) { continue; }
			if (!box || !box[0] || !box[1]) continue;
			for (var a = 0; a < 3; a++) {
				span = Math.max(span, Math.abs(box[1][a] - box[0][a]));
				// An off-centre part needs a grid that reaches it, not just one as
				// wide as the part itself.
				span = Math.max(span, Math.abs(box[0][a]) * 2, Math.abs(box[1][a]) * 2);
			}
		}
		return span;
	}

	// Round up to the next 1/2/5 x 10^n so the grid lands on readable numbers.
	function niceSpan(span) {
		var target = span * 2;
		if (!isFinite(target) || target <= 0) return 200;
		var mag = Math.pow(10, Math.floor(Math.log(target) / Math.LN10));
		var mult = target / mag;
		var step = mult <= 1 ? 1 : mult <= 2 ? 2 : mult <= 5 ? 5 : 10;
		return Math.max(20, step * mag);
	}

	// ---- regl renderer: camera, orbit controls, grid, dark theme ----
	function render(geometry) {
		var prepareRender = regl.prepareRender;
		var drawCommands = regl.drawCommands;
		var cameras = regl.cameras;
		var controls = regl.controls;
		var entitiesFromSolids = regl.entitiesFromSolids;

		var mat4 = jscad.maths.mat4;
		var perspectiveCamera = cameras.perspective;
		var orbitControls = controls.orbit;

		var width = container.clientWidth;
		var height = container.clientHeight;

		// Camera — matches jscad.app default perspective
		var camera = Object.assign({}, perspectiveCamera.defaults);
		camera.position = [450, 550, 700];
		camera.target = [0, 0, 0];
		camera.up = [0, 0, 1];
		perspectiveCamera.setProjection(camera, camera, { width: width, height: height });
		perspectiveCamera.update(camera, camera);

		// Controls
		var controlsState = Object.assign({}, orbitControls.defaults);

		// jscad.app dark theme
		var lighting = {
			background: [0.211, 0.2, 0.207, 1],
			meshColor: [1, 0.4, 0, 1],
			lightDirection: [0.2, 0.2, 1],
			lightPosition: [100, 200, 100],
			ambientLightAmount: 0.3,
			diffuseLightAmount: 0.89,
			specularLightAmount: 0.16,
			materialShininess: 8.0
		};

		var renderer = prepareRender({
			glOptions: { container: container },
			rendering: lighting
		});

		// Convert geometry to entities — orange mesh color (jscad.app dark theme)
		var solids = Array.isArray(geometry) ? geometry : [geometry];
		var entities = entitiesFromSolids({ color: [1, 0.4, 0, 1] }, solids);

		// Grid sized to the model rather than fixed at 200. A 12mm part on a 200mm
		// grid reads as a speck on a runway; a 400mm part runs off the edge of one.
		var rawSpan = modelSpan(solids);
		var gridSpan = niceSpan(rawSpan);
		var gridOptions = {
			visuals: { drawCmd: 'drawGrid', show: true, transparent: true },
			size: [gridSpan, gridSpan],
			// 10 major cells, 5 minor per cell. The old 20/200 split was tuned for a
			// camera parked far away; once the view is fitted to the model that same
			// ratio puts 200 lines across the frame and reads as a solid mat.
			ticks: [gridSpan / 10, gridSpan / 50],
			color: [1, 1, 1, 0.5],
			// Softer than the original 0.5: the fitted camera sits much closer, and
			// at that distance the sub-grid was reading as a solid mat behind the part.
			subColor: [0, 1, 1, 0.22]
		};

		// Axes — RGB for XYZ, always visible
		var axisOptions = {
			visuals: { drawCmd: 'drawAxis', show: true },
			size: gridSpan / 2,
			alwaysVisible: true
		};

		var renderOptions = {
			camera: camera,
			rendering: lighting,
			drawCommands: {
				drawAxis: drawCommands.drawAxis,
				drawGrid: drawCommands.drawGrid,
				drawLines: drawCommands.drawLines,
				drawMesh: drawCommands.drawMesh
			},
			entities: [gridOptions, axisOptions].concat(entities)
		};

		// Frame the model. Done once, on the first render only: refitting on every
		// parameter change would yank the view out from under anyone dragging a
		// slider. Run remounts the frame, so a re-run reframes.
		// A model under 4 units across is the placeholder main() returns when there
		// is nothing solid yet -- a sketch on its own, for instance. Framing THAT
		// puts everything else behind the camera and the sketch corners stop
		// projecting at all. In that case the anchors are the only real extent
		// there is, so fitAnchors() below frames those instead.
		// niceSpan floors at 20, so it cannot answer this -- ask the model.
		var fitWorth = rawSpan > 4;
		try {
			var fitted = fitWorth && orbitControls.zoomToFit({
				controls: controlsState, camera: camera, entities: entities
			});
			if (fitted && fitted.camera && fitted.camera.target) {
				camera.target = fitted.camera.target;
				controlsState = Object.assign({}, controlsState, fitted.controls);
			}
		} catch (e) { /* keep the default framing rather than failing to draw */ }

		// The one hook the Dimensions panel needs: rebuild entities in place.
		swapGeometry = function(geometry) {
			var next = Array.isArray(geometry) ? geometry : [geometry];
			renderOptions.entities = [gridOptions, axisOptions].concat(
				entitiesFromSolids({ color: [1, 0.4, 0, 1] }, next)
			);
			anchorsDirty = true;
		};

		if (rebuildPending) { rebuildPending = false; rebuild({}); }

		// ---- Orbit controls input ----
		var pointerDown = false;
		var lastX = 0, lastY = 0;
		var rotateDelta = [0, 0];
		var panDelta = [0, 0];
		var zoomDelta = 0;

		container.onpointerdown = function(ev) {
			pointerDown = true;
			lastX = ev.pageX;
			lastY = ev.pageY;
			container.setPointerCapture(ev.pointerId);
		};
		container.onpointerup = function(ev) {
			pointerDown = false;
			container.releasePointerCapture(ev.pointerId);
		};
		container.onpointermove = function(ev) {
			if (!pointerDown) return;
			var dx = ev.pageX - lastX;
			var dy = ev.pageY - lastY;
			lastX = ev.pageX;
			lastY = ev.pageY;
			if (ev.shiftKey || ev.buttons === 4) {
				panDelta[0] += dx;
				panDelta[1] += dy;
			} else {
				rotateDelta[0] -= dx;
				rotateDelta[1] -= dy;
			}
		};
		container.onwheel = function(ev) {
			ev.preventDefault();
			zoomDelta += ev.deltaY;
		};

		// ---- Render loop ----
		var rotateSpeed = 0.002;
		var panSpeed = 1;
		var zoomSpeed = 0.08;

		// Screen position of a world point, plus how many pixels one unit along
		// the handle's axis covers there. Projecting origin AND origin+axis gives
		// both the anchor and its on-screen direction in one go.
		// Done by hand rather than with vec3.transform, which divides by w inside
		// and throws away the sign -- and the sign is the only thing separating a
		// point in front of the camera from its mirror image behind it.
		// JSCAD matrices are column-major, so m[0..3] is the first column.
		var clip = mat4.create();
		function toScreen(p, out) {
			var m = clip;
			var w = m[3] * p[0] + m[7] * p[1] + m[11] * p[2] + m[15];
			if (!w) return false;
			var x = m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12];
			var y = m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13];
			out[0] = (x / w * 0.5 + 0.5) * container.clientWidth;
			out[1] = (0.5 - y / w * 0.5) * container.clientHeight;
			return w > 0;
		}

		// Frame a set of world points. Only used when the model itself is the
		// placeholder: a sketch has no solid to fit, but its corners have extent.
		// Same arithmetic zoomToFit uses, on points rather than entities.
		var anchorsFitted = false;
		function fitAnchors() {
			if (anchorsFitted || fitWorth || anchors.length < 2) return;
			var lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
			for (var i = 0; i < anchors.length; i++) {
				for (var k = 0; k < 3; k++) {
					lo[k] = Math.min(lo[k], anchors[i].origin[k]);
					hi[k] = Math.max(hi[k], anchors[i].origin[k]);
				}
			}
			var dia = Math.sqrt(
				Math.pow(hi[0] - lo[0], 2) + Math.pow(hi[1] - lo[1], 2) + Math.pow(hi[2] - lo[2], 2)
			);
			if (!isFinite(dia) || dia < 0.001) return;
			var target = [(lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2];
			var d = Math.sqrt(
				Math.pow(camera.position[0] - target[0], 2)
				+ Math.pow(camera.position[1] - target[1], 2)
				+ Math.pow(camera.position[2] - target[2], 2)
			);
			if (!d) return;
			camera.target = target;
			controlsState = Object.assign({}, controlsState, {
				scale: dia * 1.5 / Math.tan(camera.fov / 2) / d
			});
			anchorsFitted = true;
		}

		var aHere = [0, 0], aThere = [0, 0];
		projectAnchors = function() {
			if (!anchors.length) {
				try { window.parent.postMessage({ source: 'reshape-anchors', points: [] }, '*'); } catch (_) {}
				return;
			}
			fitAnchors();
			mat4.multiply(clip, camera.projection, camera.view);
			var points = [];
			for (var i = 0; i < anchors.length; i++) {
				var a = anchors[i];
				if (!toScreen(a.origin, aHere)) continue;
				toScreen([
					a.origin[0] + a.axis[0], a.origin[1] + a.axis[1], a.origin[2] + a.axis[2]
				], aThere);
				var dx = aThere[0] - aHere[0], dy = aThere[1] - aHere[1];
				var px = Math.sqrt(dx * dx + dy * dy);
				if (px < 0.001) continue;  // axis points at the camera; undraggable
				var pt = {
					param: a.param, label: a.label, kind: a.kind,
					x: aHere[0], y: aHere[1],
					dirX: dx / px, dirY: dy / px, pxPerUnit: px,
					// Screen pixels per world unit along the axis, as a vector. A
					// handle that moves in a plane needs both of these, and they are
					// not perpendicular on screen once the camera turns.
					ux: dx, uy: dy
				};
				if (a.axisV && a.paramV) {
					toScreen([
						a.origin[0] + a.axisV[0], a.origin[1] + a.axisV[1], a.origin[2] + a.axisV[2]
					], aThere);
					pt.paramV = a.paramV;
					pt.vx = aThere[0] - aHere[0];
					pt.vy = aThere[1] - aHere[1];
				}
				points.push(pt);
			}
			try { window.parent.postMessage({ source: 'reshape-anchors', points: points }, '*'); } catch (_) {}
		};

		function updateAndRender() {
			if (rotateDelta[0] || rotateDelta[1] || panDelta[0] || panDelta[1] || zoomDelta) {
				anchorsDirty = true;
			}
			if (rotateDelta[0] || rotateDelta[1]) {
				var rotated = orbitControls.rotate({
					controls: controlsState, camera: camera, speed: rotateSpeed
				}, rotateDelta);
				controlsState = Object.assign({}, controlsState, rotated.controls);
				rotateDelta = [0, 0];
			}
			if (panDelta[0] || panDelta[1]) {
				var panned = orbitControls.pan({
					controls: controlsState, camera: camera, speed: panSpeed
				}, panDelta);
				controlsState = Object.assign({}, controlsState, panned.controls);
				camera.position = panned.camera.position;
				camera.target = panned.camera.target;
				panDelta = [0, 0];
			}
			if (zoomDelta) {
				var zoomed = orbitControls.zoom({
					controls: controlsState, camera: camera, speed: zoomSpeed
				}, zoomDelta);
				controlsState = Object.assign({}, controlsState, zoomed.controls);
				zoomDelta = 0;
			}

			var updated = orbitControls.update({
				controls: controlsState, camera: camera
			});
			controlsState = Object.assign({}, controlsState, updated.controls);
			camera.position = updated.camera.position;
			perspectiveCamera.update(camera);

			renderOptions.camera = camera;
			renderer(renderOptions);
			// Once per frame at most, and only when the view or the model moved --
			// a message per frame regardless would be 60/s of pure noise.
			// Guarded: a throw in here stops the rAF loop and freezes the view.
			if (anchorsDirty && projectAnchors) { anchorsDirty = false; projectAnchors(); }
			window.requestAnimationFrame(updateAndRender);
		}

		window.requestAnimationFrame(updateAndRender);

		window.addEventListener('resize', function() {
			var w = container.clientWidth;
			var h = container.clientHeight;
			perspectiveCamera.setProjection(camera, camera, { width: w, height: h });
		});
	}
	// EVERYTHING ABOVE THIS LINE IS A DECLARATION. The run goes last, and must
	// stay last.
	//
	// This file used to call draw() from the middle of the IIFE, with `var x =
	// null` statements below it. Those re-run at their own position -- after
	// render() has already assigned them -- so they silently wipe live state.
	// It cost two bugs: swapGeometry (a parameter change drew nothing) and
	// projectAnchors (a null got called inside the rAF loop, the loop threw, and
	// rendering froze, which read as "the slider does nothing").
	//
	// scripts/check-runner-hoisting.mjs fails the build if an initialised `var`
	// appears after this point.
	statusEl.textContent = 'Running your code…';
	var result;
	try {
		result = mainFn(liveParams);
	} catch (e) {
		// Route through window.onerror so the reporter can read the stack and
		// blame the right line of script.js.
		window.dispatchEvent(new ErrorEvent('error', { error: e, message: e && e.message, filename: 'script.js' }));
		statusEl.textContent = '';
		return;
	}

	// V2 allows main() to be async.
	if (result && typeof result.then === 'function') {
		result.then(draw, function(e) {
			window.dispatchEvent(new ErrorEvent('error', { error: e, message: e && e.message, filename: 'script.js' }));
			statusEl.textContent = '';
		});
	} else {
		draw(result);
	}

})();
</script>
</body>
</html>
