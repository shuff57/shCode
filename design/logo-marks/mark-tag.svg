<svg xmlns="http://www.w3.org/2000/svg" class="mk-tag" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="shCode">
  <title>shCode — Tag</title>
  <style>
    .mk-tag .tg-br {
      fill: none;
      stroke: var(--mark, #5baafd);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 25;
      stroke-dashoffset: 0;
      animation: tg-draw 4.6s cubic-bezier(.22, 1, .36, 1) infinite both;
    }
    .mk-tag .tg-br-r { animation-delay: .14s; }
    .mk-tag .tg-blk {
      fill: var(--accent, #50fa7b);
      transform-box: view-box;
      transform-origin: 24px 24px;
      animation: tg-block 4.6s cubic-bezier(.22, 1, .36, 1) infinite both;
    }
    @keyframes tg-draw {
      0%     { stroke-dashoffset: 25; }
      13%    { stroke-dashoffset: 0; }
      88%    { stroke-dashoffset: 0; }
      95%    { stroke-dashoffset: 25; }
      100%   { stroke-dashoffset: 25; }
    }
    @keyframes tg-block {
      0%, 16%  { opacity: 0; transform: scale(.2); }
      22%      { opacity: 1; transform: scale(1.18); }
      27%, 70% { opacity: 1; transform: scale(1); }
      73%      { opacity: .2; }
      76%, 90% { opacity: 1; transform: scale(1); }
      95%, 100%{ opacity: 0; transform: scale(.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mk-tag * { animation: none !important; }
    }
  </style>
  <path class="tg-br" d="M19 14 L11.5 24 L19 34"/>
  <path class="tg-br tg-br-r" d="M29 14 L36.5 24 L29 34"/>
  <rect class="tg-blk" x="21" y="19" width="6" height="10" rx="2"/>
</svg>
