<svg xmlns="http://www.w3.org/2000/svg" class="mk-cursor" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="shCode">
  <title>shCode — Cursor</title>
  <style>
    .mk-cursor .cu-line {
      fill: var(--mark, #5baafd);
      transform-box: view-box;
      transform-origin: 10px 23px;
      animation: cu-line 4.8s linear infinite both;
    }
    .mk-cursor .cu-caret {
      fill: var(--accent, #50fa7b);
      transform-box: view-box;
      transform-origin: 0 0;
      animation: cu-caret 4.8s linear infinite both;
    }
    @keyframes cu-line {
      0%, 5%      { transform: scaleX(.15); opacity: 0; }
      8%, 18%     { transform: scaleX(.15); opacity: 1; }
      19%, 30%    { transform: scaleX(.45); }
      31%, 40%    { transform: scaleX(.72); }
      41%, 88%    { transform: scaleX(1); opacity: 1; }
      94%, 100%   { transform: scaleX(1); opacity: 0; }
    }
    @keyframes cu-caret {
      0%, 5%      { transform: translate(-17px, 0); opacity: 0; }
      8%          { transform: translate(-17px, 0); opacity: 1; }
      11%         { opacity: .15; }
      14%, 18%    { transform: translate(-17px, 0); opacity: 1; }
      19%, 30%    { transform: translate(-11px, 0); }
      31%, 40%    { transform: translate(-5.6px, 0); }
      41%, 88%    { transform: translate(0, 0); opacity: 1; }
      94%, 100%   { transform: translate(0, 0); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mk-cursor * { animation: none !important; }
    }
  </style>
  <rect class="cu-line" x="10" y="20" width="20" height="6" rx="3"/>
  <rect class="cu-caret" x="32" y="12" width="5" height="22" rx="2"/>
</svg>
