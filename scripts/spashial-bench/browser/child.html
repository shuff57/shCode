<!doctype html>
<meta charset="utf-8">
<script type="module">
  // Runs inside the sandboxed iframe (opaque origin). Same scene as bench.mjs, smaller.
  const post = (m) => parent.postMessage(m, '*');
  try {
    // location.origin is derived from the URL; self.origin is the document's real origin ('null' when opaque).
    // localStorage must throw in an opaque origin: a second, independent proof the sandbox is really on.
    let storageBlocked = false;
    try { void localStorage.length; } catch { storageBlocked = true; }
    const sandboxProof = { selfOrigin: self.origin, opaque: self.origin === 'null', localStorageBlocked: storageBlocked };
    post({ stage: 'origin', ...sandboxProof });
    const t0 = performance.now();
    const init = (await import('/vendor/jolt/jolt-physics.wasm.js')).default;
    const J = await init({ locateFile: (f) => '/vendor/jolt/' + f });
    const initMs = performance.now() - t0;

    const DT = 1 / 60, L_STATIC = 0, L_MOVING = 1;
    const make = (sleep) => {
      const s = new J.JoltSettings();
      const pairs = new J.ObjectLayerPairFilterTable(2);
      pairs.EnableCollision(L_STATIC, L_MOVING); pairs.EnableCollision(L_MOVING, L_MOVING);
      const bpi = new J.BroadPhaseLayerInterfaceTable(2, 2);
      bpi.MapObjectToBroadPhaseLayer(L_STATIC, new J.BroadPhaseLayer(0));
      bpi.MapObjectToBroadPhaseLayer(L_MOVING, new J.BroadPhaseLayer(1));
      s.mObjectLayerPairFilter = pairs; s.mBroadPhaseLayerInterface = bpi;
      s.mObjectVsBroadPhaseLayerFilter = new J.ObjectVsBroadPhaseLayerFilterTable(bpi, 2, pairs, 2);
      const jolt = new J.JoltInterface(s); J.destroy(s);
      const sys = jolt.GetPhysicsSystem(); sys.SetGravity(new J.Vec3(0, -10, 0));
      const bi = sys.GetBodyInterface();
      const add = (shape, x, y, z, moving) => {
        const cs = new J.BodyCreationSettings(shape, new J.RVec3(x, y, z), new J.Quat(0, 0, 0, 1),
          moving ? J.EMotionType_Dynamic : J.EMotionType_Static, moving ? L_MOVING : L_STATIC);
        cs.mFriction = 0.6; cs.mRestitution = 0; cs.mAllowSleeping = moving ? sleep : true;
        const b = bi.CreateBody(cs); J.destroy(cs);
        bi.AddBody(b.GetID(), moving ? J.EActivation_Activate : J.EActivation_DontActivate);
        return b;
      };
      return { jolt, add };
    };
    const box = (hx, hy, hz) => new J.BoxShape(new J.Vec3(hx, hy, hz), 0.05, null);
    const stats = (xs) => { const s = [...xs].sort((a, b) => a - b); return { mean: +(xs.reduce((a, b) => a + b, 0) / xs.length).toFixed(2), p95: +s[Math.floor(s.length * 0.95)].toFixed(2), max: +s[s.length - 1].toFixed(1) }; };
    const run = (w, n) => { const ms = []; for (let i = 0; i < n; i++) { const t = performance.now(); w.jolt.Step(DT, 1); ms.push(performance.now() - t); } return ms; };

    // pyramid: 105 boxes must stand
    let w = make(false);
    w.add(box(40, 0.5, 40), 0, -0.5, 0, false);
    const bodies = [];
    for (let layer = 0; layer < 14; layer++) for (let i = 0; i < 14 - layer; i++) {
      const x = (i - (14 - layer - 1) / 2) * 1.02, y = 0.5 + layer;
      bodies.push({ b: w.add(box(0.5, 0.5, 0.5), x, y, 0, true), x, y });
    }
    const pyramidMs = run(w, 600);
    const moved = bodies.filter(({ b, x, y }) => { const p = b.GetPosition(); return Math.hypot(p.GetX() - x, p.GetY() - y, p.GetZ()) > 0.3; }).length;
    J.destroy(w.jolt);

    // rain: 400 bodies into a bin
    w = make(false);
    w.add(box(14, 0.5, 14), 0, -0.5, 0, false);
    for (const [x, z] of [[12.5, 0], [-12.5, 0]]) w.add(box(0.5, 4.5, 13), x, 4, z, false);
    for (const z of [12.5, -12.5]) w.add(box(13, 4.5, 0.5), 0, 4, z, false);
    let seed = 1234; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
    const rain = [];
    for (let layer = 0; layer < 4; layer++) for (let ix = 0; ix < 10; ix++) for (let iz = 0; iz < 10; iz++) {
      const x = (ix - 4.5) * 1.15 + (rnd() - 0.5) * 0.3, z = (iz - 4.5) * 1.15 + (rnd() - 0.5) * 0.3, y = 2 + layer * 1.3;
      rain.push(w.add(rnd() < 0.5 ? new J.SphereShape(0.4) : box(0.4, 0.4, 0.4), x, y, z, true));
    }
    const rainMs = run(w, 300);
    const escaped = rain.filter((b) => { const p = b.GetPosition(); return Math.abs(p.GetX()) > 13 || Math.abs(p.GetZ()) > 13 || p.GetY() < -2; }).length;
    J.destroy(w.jolt);

    post({ ok: true, sandbox: sandboxProof, initMs: +initMs.toFixed(0), userAgent: navigator.userAgent.replace(/.*(HeadlessChrome\/[\d.]+).*/, '$1'),
      pyramid: { bodies: bodies.length, step: stats(pyramidMs), movedOver30cm: moved },
      rain: { bodies: rain.length, step: stats(rainMs), escaped } });
  } catch (e) {
    post({ ok: false, error: String(e && e.message || e), stack: String(e && e.stack || '').split('\n').slice(0, 4) });
  }
</script>
