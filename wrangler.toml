# Cloudflare Pages + Functions config.
# The `functions/` directory is picked up automatically — each .ts file there
# becomes a route handler. The `out/` dir is the static export from
# `npm run build` (Next.js `output: 'export'`).

name = "shcode"
pages_build_output_dir = "out"
compatibility_date = "2025-04-01"

# D1 database binding for per-student commit history. Create the DB once:
#
#   npx wrangler d1 create shcode-commits
#
# Then paste the returned `database_id` here, and update the production copy
# in the Cloudflare dashboard (Pages project -> Settings -> Functions ->
# D1 database bindings -> add DB with same binding name "DB").
[[d1_databases]]
binding = "DB"
database_name = "shcode-commits"
database_id = "de53517f-5d1f-4d70-a1f9-13d463abb76f"

# R2 bucket for student image uploads. The bytes live here; ownership and
# quota live in D1's `uploads` table (migrations/0015_uploads.sql).
#
#   npx wrangler r2 bucket create shcode-uploads
#
# Then add the same binding in the dashboard (Pages project -> Settings ->
# Functions -> R2 bucket bindings -> binding name "UPLOADS").
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "shcode-uploads"

# AUTH_SECRET is the HS256 signing key for session JWTs. It MUST be set as
# a Pages secret (not a plain var) in production:
#
#   npx wrangler pages secret put AUTH_SECRET --project-name shcode
#
# For `wrangler pages dev` on localhost you can paste a throwaway value into
# a .dev.vars file at repo root:
#
#   AUTH_SECRET=local-dev-secret-$(openssl rand -hex 16)

# Workers AI: the grader's FIRST choice in functions/api/grade-written.ts.
# Declaring it here covers local `wrangler pages dev`; production reads the
# binding from the Pages dashboard, so add it there too:
#   Pages project -> Settings -> Functions -> Workers AI binding -> name "AI".
# With the binding present the grader calls @cf/google/gemma-4-26b-a4b-it and
# needs no API key; without it the route falls back to Ollama below.
[ai]
binding = "AI"

# OLLAMA_API_KEY powers the AI essay grader in functions/api/grade-written.ts.
# Create a key at https://ollama.com/settings/keys and store it as a secret:
#
#   npx wrangler pages secret put OLLAMA_API_KEY --project-name shcode
#
# Optional: set OLLAMA_HOST if you ever want to point at something other than
# https://ollama.com (e.g. a self-hosted proxy). Plain env var, not a secret.
#
# That is the WHOLE list: one grader, one target. Workers AI is the transport
# whenever the `AI` binding above exists; Ollama is the fallback (and what the
# dev server uses). A self-hosted classroom box (OLLAMA_LOCAL_*) and a second
# paid provider (OPENROUTER_*) were both removed 2026-09-30 and have not come
# back. If you are reading an older revision of this file or of CLAUDE.md and
# it describes a picker, that text is history, not configuration.
# Real-time rooms (codehs-review/REALTIME-SPEC.md): the LiveRoom Durable Object
# lives in its own Worker, workers/live/ (name shcode-live). Deploy THAT first
# (cd workers/live && npx wrangler deploy), then this binding can resolve; add
# the same binding in the dashboard if production reads it from there:
#   Pages project -> Settings -> Functions -> Durable Object bindings ->
#   variable "LIVE", namespace shcode-live / LiveRoom.
# With the binding missing, GET /api/live/[code] and POST /api/rooms {live:true}
# answer 503 and nothing else changes (polling rooms do not use it).
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoom"
script_name = "shcode-live"

# Code together (REALTIME-SPEC.md Part 2, migration 0044): the LiveDoc Durable
# Object in the same Worker (workers/live/, class LiveDoc, migration tag v2).
# Deploy order: apply 0044 (npm run d1:migrate), deploy workers/live (adds
# LiveDoc), THEN the site with this binding. Dashboard twin if production reads
# it from there: Durable Object bindings -> variable "LIVE_DOC", namespace
# shcode-live / LiveDoc. With it missing, POST /api/rooms {kind:'code'} and a
# code room's GET /api/live/[code] answer 503 and nothing else changes.
[[durable_objects.bindings]]
name = "LIVE_DOC"
class_name = "LiveDoc"
script_name = "shcode-live"
