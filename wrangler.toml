# Cloudflare Pages + Functions config.
# The `functions/` directory is picked up automatically — each .ts file there
# becomes a route handler. The `out/` dir is the static export from
# `npm run build` (Next.js `output: 'export'`).

name = "shcode"
pages_build_output_dir = "out"
compatibility_date = "2025-04-01"

# D1 database binding for per-student commit history. Create the DB once:
#
#   npx wrangler d1 create shcode-commits
#
# Then paste the returned `database_id` here, and update the production copy
# in the Cloudflare dashboard (Pages project -> Settings -> Functions ->
# D1 database bindings -> add DB with same binding name "DB").
[[d1_databases]]
binding = "DB"
database_name = "shcode-commits"
database_id = "de53517f-5d1f-4d70-a1f9-13d463abb76f"

# R2 bucket for student image uploads. The bytes live here; ownership and
# quota live in D1's `uploads` table (migrations/0015_uploads.sql).
#
#   npx wrangler r2 bucket create shcode-uploads
#
# Then add the same binding in the dashboard (Pages project -> Settings ->
# Functions -> R2 bucket bindings -> binding name "UPLOADS").
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "shcode-uploads"

# AUTH_SECRET is the HS256 signing key for session JWTs. It MUST be set as
# a Pages secret (not a plain var) in production:
#
#   npx wrangler pages secret put AUTH_SECRET --project-name shcode
#
# For `wrangler pages dev` on localhost you can paste a throwaway value into
# a .dev.vars file at repo root:
#
#   AUTH_SECRET=local-dev-secret-$(openssl rand -hex 16)

# OLLAMA_API_KEY powers the AI essay grader in functions/api/grade-written.ts.
# Create a key at https://ollama.com/settings/keys and store it as a secret:
#
#   npx wrangler pages secret put OLLAMA_API_KEY --project-name shcode
#
# Optional: set OLLAMA_HOST if you ever want to point at something other than
# https://ollama.com (e.g. a self-hosted proxy). Plain env var, not a secret.
